const cats = ['提问与学习', '查资料与找方案', '文字与结构', '图片与动画', '页面与交互', '数据与脚本'];

function el(tag, a = {}, text) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
  if (text !== undefined) {e.dataset.labelKey=text;e.textContent=labelText(text);}
  return e;
}

function chartRight() {
  return 1520;
}

function xy(d) {
  return [150 + d.alignment * (chartRight() - 150) / 100, 790 - d.investment * 5.8];
}

const nodes = content.tasks.map(d => {
  const node = el('g', { class: 'task', tabindex: 0, role: 'button', 'aria-label': d.text });
  const ring = el('circle', { class: 'ring', r: 9.5, fill: 'none', stroke: d.color, 'stroke-width': 2.5, opacity: 0 });
  const dot = el('circle', { class: 'dot', r: 5, fill: d.color });
  const text = el('text', { x: 10, y: -5, 'font-size': 11 });
  const title = el('title', {}, d.text + '：对齐依据 ' + d.alignment + '，预期投入 ' + d.investment + '。' + d.reason);
  node.append(ring, dot, text, title);

  function showDetail() {
    // Selection stays on the graphic without opening a text panel.
    nodes.forEach(n=>n.querySelector('.ring').setAttribute('opacity',n===node?'1':'0'));
  }

  node.addEventListener('click', showDetail);
  node.addEventListener('focus', showDetail);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showDetail();
    }
  });

  layer.append(node);
  return node;
});

// Break request text at commas when possible and keep closing punctuation on the previous line.
function wrapRequest(value, max) {
  const lines = [];
  let rest = value;
  while (rest.length > max) {
    let cut = -1;
    for (let k = max; k >= 4; k--) if ('，、：'.includes(rest[k - 1])) { cut = k; break; }
    if (cut < 0) cut = Math.ceil(rest.length / Math.ceil(rest.length / max));
    while (cut < rest.length && '。，、：？！）”'.includes(rest[cut])) cut++;
    lines.push(rest.slice(0, cut));
    rest = rest.slice(cut);
  }
  if (rest) lines.push(rest);
  return lines;
}

function update() {
  const s = content.slides[page];
  if(page>0){renderScatter();return;}
  const sequence = s.sequence || [];
  const current = sequence.length > 0 ? sequence[Math.min(step, sequence.length - 1)] : null;
  let catCounts = [0, 0, 0, 0, 0, 0];
  let boxes = [];

  // Determine layout priority order for tasks on slides 2..6
  let layoutOrder = [];
  if (page >= 2) {
    if (current !== null && current !== undefined) layoutOrder.push(current);
    sequence.forEach(id => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
    s.active.forEach(id => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
    content.tasks.forEach((_, id) => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
  } else {
    layoutOrder = content.tasks.map((_, id) => id);
  }

  // Pre-calculate label placements with smart collision testing (try right, then try left)
  const labelStates = new Map();

  for (const id of layoutOrder) {
    const d = content.tasks[id];
    const p = (page === 0) ? [72 + d.cat * 249, 300 + (catCounts[d.cat]++) * (465 / Math.max(1,content.tasks.filter(t=>t.cat===d.cat).length-1))] : xy(d);
    const active = s.active.includes(d.id);
    const isCurrent = (page === 6 && d.id === current);
    const isSequence = (page === 6 && sequence.includes(d.id));

    if (page === 0) {
      labelStates.set(id, { visible: true, tx: 10, ty: 0, anchor: 'start', fontSize: 19, fontWeight: '400', fill: '#252b30', isWrapped: true, opacity: 1 });
    } else if (page === 1) {
      const fontSize = 16;
      const w = d.text.length * fontSize * 0.95;
      // Try right placement
      let chosen = null;
      if (p[0] + w + 12 <= chartRight()) {
        const boxRight = { x: p[0] + 10, y: p[1] - 17, w, h: 18 };
        const collideRight = boxes.some(b => boxRight.x < b.x + b.w && boxRight.x + boxRight.w > b.x && boxRight.y < b.y + b.h && boxRight.y + boxRight.h > b.y);
        if (!collideRight) chosen = { box: boxRight, tx: 10, anchor: 'start' };
      }
      if (!chosen && p[0] - w - 10 >= 70) {
        const boxLeft = { x: p[0] - w - 10, y: p[1] - 17, w, h: 18 };
        const collideLeft = boxes.some(b => boxLeft.x < b.x + b.w && boxLeft.x + boxLeft.w > b.x && boxLeft.y < b.y + b.h && boxLeft.y + boxLeft.h > b.y);
        if (!collideLeft) chosen = { box: boxLeft, tx: -10, anchor: 'end' };
      }
      if (chosen) {
        boxes.push(chosen.box);
        labelStates.set(id, { visible: true, tx: chosen.tx, ty: -4, anchor: chosen.anchor, fontSize: 16, fontWeight: '400', fill: '#334155', isWrapped: false, opacity: 0.9 });
      } else {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize: 16, fontWeight: '400', fill: '#334155', isWrapped: false, opacity: 0 });
      }
    } else {
      // Pages 2..6 (Slides 3..7)
      if (!active) {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize: 12, fontWeight: '400', fill: '#64748b', isWrapped: false, opacity: 0 });
        continue;
      }
      const fontSize = (page === 6 && isCurrent) ? 19 : 17;
      const fontWeight = (page === 6 && isCurrent) ? '600' : '500';
      const fill = (page === 6 && isCurrent) ? '#0f172a' : '#1e293b';
      const w = d.text.length * fontSize * 0.95;
      const h = 18;

      let chosen = null;
      if (p[0] + w + 14 <= chartRight()) {
        const boxRight = { x: p[0] + 12, y: p[1] - 17, w, h };
        const collideRight = boxes.some(b => boxRight.x < b.x + b.w && boxRight.x + boxRight.w > b.x && boxRight.y < b.y + b.h && boxRight.y + boxRight.h > b.y);
        if (!collideRight) chosen = { box: boxRight, tx: 12, anchor: 'start' };
      }
      if (!chosen && p[0] - w - 12 >= 70) {
        const boxLeft = { x: p[0] - w - 12, y: p[1] - 17, w, h };
        const collideLeft = boxes.some(b => boxLeft.x < b.x + b.w && boxLeft.x + boxLeft.w > b.x && boxLeft.y < b.y + b.h && boxLeft.y + boxLeft.h > b.y);
        if (!collideLeft) chosen = { box: boxLeft, tx: -12, anchor: 'end' };
      }
      if (!chosen && (page === 6 && isCurrent)) {
        const isRight = (chartRight() - p[0]) >= (p[0] - 80);
        chosen = { box: { x: isRight ? p[0] + 14 : p[0] - w - 14, y: p[1] - 17, w, h }, tx: isRight ? 14 : -14, anchor: isRight ? 'start' : 'end' };
      }

      if (chosen) {
        boxes.push(chosen.box);
        labelStates.set(id, { visible: true, tx: chosen.tx, ty: -4, anchor: chosen.anchor, fontSize, fontWeight, fill, isWrapped: false, opacity: 1 });
      } else {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize, fontWeight, fill, isWrapped: false, opacity: 0 });
      }
    }
  }

  // Apply visual updates to nodes
  content.tasks.forEach((d, i) => {
    const node = nodes[i];
    const active = s.active.includes(d.id);
    const isRing = (page >= 2 && page <= 5 && active) || (page === 6 && s.sequence && s.sequence.includes(d.id));

    const ring = node.querySelector('.ring');
    ring.setAttribute('opacity', isRing ? '0.85' : '0');

    node.style.opacity = (page < 2) ? '1' : (active ? '1' : '0.12');

    const text = node.querySelector('text');
    text.replaceChildren();

    const ls = labelStates.get(d.id);
    if (!ls) return;

    let leader=node.querySelector('.label-leader');
    if(!leader){leader=el('line',{class:'label-leader',stroke:d.color,'stroke-width':1,opacity:.65});node.insertBefore(leader,node.firstChild);}
    leader.setAttribute('x1',0);leader.setAttribute('y1',0);leader.setAttribute('x2',ls.tx);leader.setAttribute('y2',ls.leaderY||0);
    leader.style.display=page>0&&ls.visible&&ls.leaderY?'':'none';
    text.setAttribute('font-size', ls.fontSize);
    text.setAttribute('fill', ls.fill);
    text.style.fontWeight = ls.fontWeight;
    text.setAttribute('x', ls.tx);
    text.setAttribute('y', ls.ty);
    text.setAttribute('text-anchor', ls.anchor);
    text.setAttribute('dominant-baseline',page===0?'central':'auto');

    if (ls.isWrapped) {
      wrapRequest(d.text, 11).forEach((line, j) => {
        text.append(el('tspan', { x: 10, dy: j === 0 ? 0 : 24 }, line));
      });
      text.style.opacity = '1';
    } else {
      text.textContent = d.text;
      text.style.opacity = ls.visible ? ls.opacity : 0;
    }
  });

  // Position nodes
  let curCatCounts = [0, 0, 0, 0, 0, 0];
  content.tasks.forEach((d, i) => {
    let p = xy(d);
    if (page === 0) {
      p = [72 + d.cat * 249, 300 + (curCatCounts[d.cat]++) * (465 / Math.max(1,content.tasks.filter(t=>t.cat===d.cat).length-1))];
    }
    nodes[i].style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
  });

  panel.querySelectorAll('.step').forEach((e, i) => {
    e.classList.toggle('on', page === 1 || i <= step);
  });

  if(page===6){const entry=s.steps[Math.min(step,s.steps.length-1)];document.getElementById('detail').textContent=entry[0]+'：'+entry[1];}
  updateControls();
}

function updateControls() {
  const s = content.slides[page];
  const maxStep = (s.steps && s.steps.length > 0) ? s.steps.length - 1 : 0;
  const canPlay = (page === 6 && maxStep > 0);
  document.getElementById('prev').disabled = (page === 0);
  document.getElementById('next').disabled = (page === 6);
  document.getElementById('prevStep').disabled = (!canPlay || step === 0);
  document.getElementById('nextStep').disabled = (!canPlay || step >= maxStep);
  document.getElementById('replay').disabled = !canPlay;
  document.querySelectorAll('[data-page]').forEach(b => {
    b.setAttribute('aria-current', Number(b.dataset.page) === page);
  });
  const playBtn = document.getElementById('play'); playBtn.setAttribute('aria-label',playing?'暂停':'播放');
  if (!canPlay) {
    playBtn.disabled = true;
    playBtn.textContent = '▷';
  } else {
    playBtn.disabled = false;
    if (step >= maxStep && !playing) {
      playBtn.textContent = '↺';
    } else {
      playBtn.textContent = playing ? 'Ⅱ' : '▷';
    }
  }
}

function schedule() { return;
  clearTimeout(timer);
  if (!playing || page !== 6) return;
  const maxStep = content.slides[page].steps.length - 1;
  timer = setTimeout(() => {
    if (step < maxStep) {
      step++;
      update();
      if (step < maxStep) {
        schedule();
      } else {
        playing = false;
        updateControls();
      }
    } else {
      playing = false;
      updateControls();
    }
  }, 2400);
}

function show(n, targetStep) {
  page = Math.max(0, Math.min(6, n));
  const s = content.slides[page];
  const maxStep = (s.steps && s.steps.length > 0) ? s.steps.length - 1 : 0;
  const canPlay = (page === 6 && maxStep > 0);
  if (targetStep !== undefined) {
    step = Math.max(0, Math.min(maxStep, targetStep));
    playing = false;
  } else {
    step = (matchMedia('(prefers-reduced-motion: reduce)').matches && s.steps.length > 0) ? maxStep : 0;
    playing = !matchMedia('(prefers-reduced-motion: reduce)').matches && canPlay;
  }
  clearTimeout(timer);
  document.getElementById('heading').textContent = s.name;
  document.getElementById('subtitle').textContent = s.line;
  document.getElementById('detail').textContent = '';
  panel.replaceChildren();
  s.steps.forEach(([title, body]) => {
    const e = document.createElement('section');
    e.className = 'step';
    const h = document.createElement('strong');
    h.textContent = title;
    const p = document.createElement('p');
    p.textContent = body;
    e.append(h, p);
    panel.append(e);
  });
  document.getElementById('hint').textContent = page === 0
    ? '45 项日常请求 · 颜色对应四象限行动状态 · 下一页查看坐标分布'
    : '评分为情境估计 · 点位保持不变 · 点击点查看依据与同位项 · 方向键翻页，上下键单步';
  background();
  update();
  if (playing) schedule();
}

window.show = show;
window.setStep = function(st) {
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  step = Math.max(0, Math.min(maxStep, st));
  playing = false;
  clearTimeout(timer);
  update();
};

for (let i = 0; i < 7; i++) {
  const b = document.createElement('button');
  b.textContent = i + 1;
  b.dataset.page = i;
  b.onclick = () => show(i);
  document.getElementById('pages').append(b);
}

document.getElementById('prev').onclick = () => show(page - 1);
document.getElementById('next').onclick = () => show(page + 1);

document.getElementById('prevStep').onclick = () => {
  if (document.getElementById('prevStep').disabled) return;
  clearTimeout(timer);
  playing = false;
  if (step > 0) {
    step--;
    update();
  }
};

document.getElementById('nextStep').onclick = () => {
  if (document.getElementById('nextStep').disabled) return;
  clearTimeout(timer);
  playing = false;
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  if (step < maxStep) {
    step++;
    update();
  }
};

document.getElementById('replay').onclick = () => {
  if (document.getElementById('replay').disabled) return;
  step = 0;
  playing = true;
  update();
  schedule();
};

document.getElementById('play').onclick = () => {
  if (document.getElementById('play').disabled) return;
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  if (step >= maxStep) {
    step = 0;
    playing = true;
    update();
    schedule();
  } else {
    playing = !playing;
    updateControls();
    if (playing) schedule();
    else clearTimeout(timer);
  }
};

document.addEventListener('keydown', e => {
  if (e.target.isContentEditable) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(page + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(page - 1); }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    if (!document.getElementById('nextStep').disabled) {
      document.getElementById('nextStep').click();
    }
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    if (!document.getElementById('prevStep').disabled) {
      document.getElementById('prevStep').click();
    }
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!document.getElementById('play').disabled) {
      document.getElementById('play').click();
    }
  }
});

if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  playing = false;
}

 scatterChart.setOption({animationDurationUpdate:450,animationEasingUpdate:'cubicOut',tooltip:{show:true,trigger:'item',confine:true,backgroundColor:'#fff',borderColor:'#dce6ef',textStyle:{fontSize:18,color:'#08244c'},formatter:p=>{const node=document.createElement('div');node.style.cssText='max-width:320px;white-space:normal;line-height:1.6';node.textContent=p.name;return node;},position:(pos,p,dom,rect,size)=>[Math.max(158*scale,Math.min(pos[0]+12,1512*scale-size.contentSize[0])),Math.max(218*scale,Math.min(pos[1]+12,782*scale-size.contentSize[1]))]},

   const p=placements.get(content.tasks[params.dataIndex].id);

   const end=[Math.max(p.x,Math.min(p.point[0],p.x+p.width)),p.y+p.height/2];
   return {x:p.x,y:p.y,align:'left',verticalAlign:'top',hideOverlap:true,labelLinePoints:[p.point,end]};
 },
 emphasis:{scale:1.5,itemStyle:{opacity:1},label:{show:true,backgroundColor:'#fff',padding:5*scale,borderColor:'#cbd7e5',borderWidth:1}},
 data:content.tasks.map(d=>({id:String(d.id),name:d.text,value:[d.alignment,d.investment],symbolSize:inside(d)?8*scale:0,emphasis:{label:{show:inside(d)}},
 itemStyle:{color:d.color,opacity:page===1||active.includes(d.id)?0.85:0.12},
 labelLine:{show:placements.has(d.id)},label:{show:placements.has(d.id),position:d.alignment>=65?'left':'right'}}))}]});
 updateControls();
}

let activeTextEditor=null;
function prepareEditableText(){
 const heading=document.getElementById('heading');
 heading.contentEditable='true';heading.classList.add('editable');
 heading.oninput=()=>{const entry=lecture[lectureIndex];if(entry.page===undefined)entry.title=heading.innerText;else content.slides[entry.page].name=heading.innerText;};
 const brand=document.querySelector('.brand');brand.contentEditable='true';brand.classList.add('editable');
 const bridge=document.getElementById('bridge');
 // Wrap text nodes, leaving the diagram geometry and icons intact.
 const walker=document.createTreeWalker(bridge,NodeFilter.SHOW_TEXT);
 const texts=[];while(walker.nextNode())if(walker.currentNode.textContent.trim()&&!walker.currentNode.parentElement.closest('svg,[contenteditable]'))texts.push(walker.currentNode);
 texts.forEach(text=>{const span=document.createElement('span');span.contentEditable='true';span.className='editable';text.replaceWith(span);span.append(text);});
 bridge.oninput=()=>{lecture[lectureIndex].html=bridge.innerHTML;};
}
function editSvgText(target){
 if(activeTextEditor)activeTextEditor.blur();
 const taskNode=target.closest('.task');
 const task=taskNode?content.tasks[nodes.indexOf(taskNode)]:content.tasks.find(d=>d.text===target.textContent.replace(/\n/g,'')||d.shortLabel===target.textContent);
 // ECharts renders wrapped lines as sibling SVG text elements.
 const chartTask=task|| (chartHost.contains(target)?content.tasks.find(d=>d.text.includes(target.textContent)&&target.textContent.length>3):null);
 const rect=target.getBoundingClientRect(),stage=document.querySelector('.stage'),bounds=stage.getBoundingClientRect();
 const factor=bounds.width/stage.clientWidth;
 const style=getComputedStyle(target),editor=document.createElement('div');
 editor.className='editable svg-text-editor';editor.contentEditable='true';editor.setAttribute('role','textbox');editor.setAttribute('aria-label','编辑文字');
 const editingShort=chartTask&&target.textContent===chartTask.shortLabel;
 editor.textContent=chartTask?(editingShort?chartTask.shortLabel:chartTask.text):target.textContent;
 const svg=target.ownerSVGElement,svgScale=svg.getBoundingClientRect().width/(svg.viewBox.baseVal.width||svg.clientWidth)/factor;
 const fontSize=parseFloat(style.fontSize)*svgScale;
 const left=(rect.left-bounds.left)/factor,top=(rect.top-bounds.top)/factor;
 editor.style.cssText=`position:absolute;z-index:30;left:${left}px;top:${top}px;min-width:${Math.max(80,rect.width/factor)}px;max-width:${stage.clientWidth-left-12}px;font-family:${style.fontFamily};font-size:${fontSize}px;font-weight:${style.fontWeight};line-height:1.4;color:${style.fill};background:white;white-space:pre-wrap;`;
 stage.append(editor);activeTextEditor=editor;
 let cancelled=false;
 editor.onkeydown=event=>{if(event.key==='Escape'){cancelled=true;editor.blur();}if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();editor.blur();}};
 editor.onblur=()=>{
   const value=editor.innerText;activeTextEditor=null;editor.remove();
   if(cancelled)return;
   if(chartTask){if(editingShort)chartTask.shortLabel=value;else chartTask.text=value;nodes[chartTask.id].setAttribute('aria-label',value);update();}
   else if(target.closest('#bridge')){target.textContent=value;lecture[lectureIndex].html=document.getElementById('bridge').innerHTML;}
   else {const key=target.dataset.labelKey||[...editedLabels].find(([,v])=>v===target.textContent)?.[0]||target.textContent;editedLabels.set(key,value);background();if(page>0)renderScatter();}
 };
 editor.focus();const range=document.createRange();range.selectNodeContents(editor);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);
}
document.querySelector('.stage').addEventListener('click',event=>{
 const target=event.target.closest('text');
 if(target)editSvgText(target);
});
let pointTransition=null,transitionTimer=null;
function stopPointTransition(){clearTimeout(transitionTimer);pointTransition?.remove();pointTransition=null;chartHost.getAnimations().forEach(a=>a.cancel());}
function animateCategoryToScatter(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const overlay=el('svg',{viewBox:'0 0 1600 900','aria-hidden':'true'});
 overlay.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none';
 document.querySelector('.stage').append(overlay);pointTransition=overlay;
 content.tasks.forEach((d,i)=>{
   const dot=el('circle',{r:4,fill:d.color});overlay.append(dot);
   const target=scatterChart.convertToPixel({seriesIndex:0},[d.alignment,d.investment]),scale=document.querySelector('.stage').clientWidth/1600;
   dot.animate([{transform:nodes[i].style.transform},{transform:`translate(${target[0]/scale}px,${target[1]/scale}px)`}],{duration:700,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
 });
 chartHost.animate([{opacity:0},{opacity:1}],{duration:350,delay:500,fill:'backwards'});
 transitionTimer=setTimeout(()=>{overlay.remove();if(pointTransition===overlay)pointTransition=null;},850);
}
let lectureIndex=0;
function manualShow(n){
 if(activeTextEditor)activeTextEditor.blur();
 const fromCategory=lectureIndex===1&&n===2;stopPointTransition();
 lectureIndex=Math.max(0,Math.min(lecture.length-1,n));clearTimeout(timer);playing=false;chartHost.style.display='none';layer.style.visibility='visible';
 const entry=lecture[lectureIndex],bridge=document.getElementById('bridge');
 if(entry.page!==undefined){originalShow(entry.page,entry.page===6?3:0);playing=false;clearTimeout(timer);bridge.style.display='none';document.querySelector('.stage>svg').style.visibility='visible';document.getElementById('detail').style.display='';}
 else{layer.style.visibility='hidden';chartHost.style.display='none';document.getElementById('heading').textContent=entry.title;bridge.innerHTML=entry.html;bridge.style.display='block';document.querySelector('.stage>svg').style.visibility='hidden';document.getElementById('detail').style.display='none';}
 prepareEditableText();
 if(fromCategory)animateCategoryToScatter();
 document.getElementById('prev').disabled=lectureIndex===0;document.getElementById('next').disabled=lectureIndex===lecture.length-1;
}
document.getElementById('prev').onclick=()=>manualShow(lectureIndex-1);
document.getElementById('next').onclick=()=>manualShow(lectureIndex+1);
document.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Space'].includes(e.code)){e.preventDefault();e.stopImmediatePropagation();if(e.code!=='Space')manualShow(lectureIndex+(['ArrowRight','PageDown'].includes(e.code)?1:-1));}},true);
window.manualShow=manualShow;manualShow(0);
if(new URLSearchParams(location.search).has('embedded')){
 const navigate=direction=>parent.postMessage({type:'investment-nav',direction},'*');
 document.getElementById('prev').onclick=()=>navigate(-1);
 document.getElementById('next').onclick=()=>navigate(1);
 window.addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','PageDown','ArrowLeft','PageUp'].includes(e.code)){e.preventDefault();e.stopImmediatePropagation();navigate(['ArrowRight','PageDown'].includes(e.code)?1:-1)}},true);
 window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='investment-page')return;manualShow(e.data.page);document.getElementById('prev').disabled=false;document.getElementById('next').disabled=false;});
}
