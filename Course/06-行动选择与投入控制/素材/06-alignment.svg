<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="06-alignment-title 06-alignment-desc"><title id="06-alignment-title">投入与对齐的四种状态</title><desc id="06-alignment-desc">横轴是下一次反馈前的投入与承诺，纵轴是有证据支持的对齐程度。</desc><defs><marker id="06-alignment-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#7A9AB8"/></marker><marker id="06-alignment-arrow-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#1769AA"/></marker><marker id="06-alignment-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#163A5F"/></marker></defs><rect width="960" height="600" fill="#FFFFFF"/><text x="40" y="56" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" fill="#163A5F">投入与对齐的四种状态</text><line x1="160" y1="496" x2="880" y2="496" stroke="#163A5F" stroke-width="2" marker-end="url(#06-alignment-arrow)"/><line x1="160" y1="496" x2="160" y2="96" stroke="#163A5F" stroke-width="2" marker-end="url(#06-alignment-arrow)"/><line x1="520" y1="112" x2="520" y2="496" stroke="#C9D8E5" stroke-width="1.5"/><line x1="160" y1="304" x2="864" y2="304" stroke="#C9D8E5" stroke-width="1.5"/><text x="520" y="544" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">下一次反馈前的投入与承诺：低 → 高</text><rect x="232" y="356" width="208" height="88" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="336" y="392" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">探索</text><rect x="232" y="164" width="208" height="88" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="336" y="200" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">轻量交付</text><rect x="600" y="164" width="208" height="88" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="704" y="200" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">深度建设</text><rect x="600" y="356" width="208" height="88" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="704" y="392" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">高暴露</text><text x="76" y="272" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">有证据支持</text><text x="76" y="296" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">的对齐</text><text x="132" y="476" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#536B80">低</text><text x="132" y="120" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#536B80">高</text><text x="336" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">低投入 · 低对齐</text><text x="336" y="224" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">低投入 · 高对齐</text><text x="704" y="224" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">高投入 · 高对齐</text><text x="704" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">高投入 · 低对齐</text><text x="520" y="584" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#536B80">坐标描述下一次反馈前的承诺，不表示累计投入或能力等级</text></svg>