<script>
(()=>{
const root=document.getElementById('room-demo');const $=s=>root.querySelector(s);
const stateKey='ai-room-demo-v1';let step=0;let animation=null;
const task='给张经理发邮件：明天的会改到下午三点。发送前先给我确认。';
const history=[
['用户任务',task],
['第1轮 · 房间里的人','请查通讯录：张经理。'],
['工具结果 · 操作员写回','张经理：zhang@example.com'],
['第2轮 · 房间里的人','拟好邮件：会议改期通知；明天的会改到下午三点。请用户确认。'],
['用户确认','收件人、主题和正文已确认，可以发送。'],
['工具结果 · 操作员写回','发送成功；收件人 zhang@example.com。'],
['第3轮 · 房间里的人','已根据发送结果，向用户报告完成。']
];
const scenes=[
{tag:'房间 A',title:'会写邮件，还不等于能发送',line:'写出了草稿，邮件还没发出。',active:1,n:0,route:[300,400,960,390],packet:'邮件草稿',next:'给房间配上工具 →',note:'先让学员看同一个任务。房间里的人有能力写草稿，但没有发送工具。问：写出“已发送”，就能证明邮件真的发了吗？不能，只凭文字无法确认执行。'},
{tag:'房间 B',title:'说明书、工具和操作员到位',line:'人写操作请求，操作员按规则调用工具。',active:0,n:0,route:null,next:'开始第一轮 →',note:'先指出墙上的规则，再指出可用工具清单，最后指出房间外的操作员。工具清单告诉模型能请求什么；实际工具由软件执行。不是看到任何代码就运行，而是识别受支持的操作请求并按权限处理。'},
{tag:'第 1 轮 · 读任务',title:'先写一张查通讯录的纸条',line:'模型提出请求，软件负责执行。',active:1,n:1,route:[330,440,980,545],packet:'查通讯录',next:'操作员去查 →',note:'第一位读任务与规则，发现还不知道收件人邮箱，写出查通讯录请求。此处纸条代指结构化的工具调用。画面为教学简化，不显示JSON。'},
{tag:'工具执行 · 写回结果',title:'查到的邮箱，写回同一份记录',line:'工具结果回到纸条，下一轮才能接着处理。',active:'op',n:2,route:[980,545,515,470],packet:'邮箱已查到',next:'交给下一轮 →',note:'操作员调用通讯录工具，收到邮箱后把结果追加到上下文。右边的纸条变长，前面的任务仍保留。示例邮箱使用example.com，不是真实收件人。'},
{tag:'第 2 轮 · 写草稿',title:'带着前面的信息，继续写邮件',line:'下一轮拿到任务和工具结果，拟好邮件。',active:2,n:3,route:[515,470,160,610],packet:'请你确认',next:'查看待确认邮件 →',note:'第二位对应同一模型的下一次调用。不是凭空记得上次发生什么，而是从传入的记录里读到任务和收件人。本例按用户要求先展示草稿，等待确认。'},
{tag:'用户确认',title:'发送之前，先让你确认',line:'确认收件人、主题和正文，再继续。',active:0,n:3,route:null,next:'确认发送（演示） →',note:'停在这里展示用户确认。下一步按钮只推进本地教学模拟，不实际发送。确认后，软件可按已确认操作执行；有些产品也会再调用模型生成发送请求，这里省略该产品差异。'},
{tag:'工具执行 · 发送邮件',title:'操作员调用邮箱，写回发送结果',line:'工具执行成功，纸条上才有发送回执。',active:'op',n:5,route:[980,545,725,460],packet:'发送成功',next:'把结果交回模型 →',note:'用户确认后，操作员调用邮件工具。画面中的成功回执是预设模拟。如果实际工具返回失败，应该保留失败信息并据此处理，不能照样说已发送。'},
{tag:'第 3 轮 · 报告结果',title:'读到发送回执，再向你报告完成',line:'读信息 → 写请求 → 工具执行 → 带结果继续。',active:3,n:6,route:[725,460,160,610],packet:'完成答复',next:'从头演示 ↺',note:'第三位读取实际工具结果，生成用户可读的完成答复。最后问学员：谁真正发出了邮件？是调用邮件工具的软件；模型负责根据当轮信息生成回复或操作请求。三个人代表三轮处理，不代表三个不同模型。'}
];
function entry(label,value,latest=false){const d=document.createElement('div');d.className='entry'+(latest?' latest':'');const b=document.createElement('b');b.textContent=label;d.append(b,document.createTextNode(value));return d;}
function drawPaper(s){const panel=$('#paper-content');panel.replaceChildren();$('#paper-title').textContent=step===0?'递出来的纸条':'随接力传递的记录';$('#paper-caption').textContent=step===0?'写好了内容，还没有发送':'任务、请求和结果一起保留';
if(step===0){panel.append(entry('收件人','张经理（邮箱尚未确定）'),entry('主题','会议改期通知'),entry('正文','张经理您好，明天的会议改到下午三点，请您知悉。',true));return;}
const c=document.createElement('div');c.className='context';c.innerHTML='<b>规则</b>　发送前先确认<br><b>工具</b>　查通讯录 · 发邮件';panel.append(c);
for(let i=0;i<=s.n;i++)panel.append(entry(history[i][0],history[i][1],i===s.n));
if(step===5){const d=document.createElement('div');d.className='confirm';d.innerHTML='<b>这封邮件可以发送吗？</b>收件人：zhang@example.com<br>主题：会议改期通知<br>正文：张经理您好，明天的会议改到下午三点，请您知悉。';panel.append(d);}
if(step===6||step===7){const d=document.createElement('div');d.className='stamp';d.textContent='✓ 已获得工具执行回执';panel.append(d);}}
function movePaper(route,label){if(animation)cancelAnimationFrame(animation);const path=$('#signal-path'),packet=$('#packet');path.style.display=route?'':'none';packet.style.display=route?'':'none';if(!route)return;const[x1,y1,x2,y2]=route;const cx=(x1+x2)/2,cy=Math.min(y1,y2)-80;path.setAttribute('d',`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`);$('#packet-label').textContent=label;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const start=performance.now();function tick(now){const t=reduced?1:Math.min(1,(now-start)/850),e=1-Math.pow(1-t,3);const x=(1-e)*(1-e)*x1+2*(1-e)*e*cx+e*e*x2,y=(1-e)*(1-e)*y1+2*(1-e)*e*cy+e*e*y2;packet.setAttribute('transform',`translate(${x} ${y})`);if(t<1)animation=requestAnimationFrame(tick);}animation=requestAnimationFrame(tick);}
function render(){const s=scenes[step];$('#scene-title').textContent=s.title;$('#kicker').textContent=s.tag;$('#takeaway').textContent=s.line;$('#step-count').textContent=String(step+1).padStart(2,'0')+' / 08';$('#speaker-note').textContent=s.note;$('#next').textContent=s.next;$('#prev').disabled=step===0;root.querySelectorAll('.equipment').forEach(el=>el.classList.toggle('absent',step===0));$('#wall-empty').style.display=step===0?'':'none';$('#draft-art').style.display=step===0?'':'none';$('#op-legend').hidden=step===0;for(let i=1;i<=3;i++)$('#worker-'+i).classList.toggle('active',s.active===i);$('#operator').classList.toggle('active',s.active==='op');$('#tool-action').textContent=step===3?'正在查通讯录':step===6?'邮件工具返回成功':'通讯录 / 邮箱';root.querySelectorAll('[data-scene]').forEach(b=>{const n=+b.dataset.scene;b.setAttribute('aria-pressed',String(n===0?step===0:n===1?step===1:step>=2));});root.querySelectorAll('.stage-dot').forEach((d,i)=>d.classList.toggle('on',i<=step));drawPaper(s);movePaper(s.route,s.packet);}
for(let i=0;i<scenes.length;i++){const d=document.createElement('span');d.className='stage-dot';$('.stages').append(d);}
$('#next').addEventListener('click',()=>{step=(step+1)%scenes.length;render();});$('#prev').addEventListener('click',()=>{step=Math.max(0,step-1);render();});root.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.scene;render();}));document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,summary'))return;if(e.key==='ArrowRight'){e.preventDefault();$('#next').click();}if(e.key==='ArrowLeft'){e.preventDefault();$('#prev').click();}});render();
})();
</script>
</body></html>
