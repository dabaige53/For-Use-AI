<svg class="room" viewBox="70 50 1050 650" role="img" aria-labelledby="room-title room-desc" xmlns="http://www.w3.org/2000/svg" width="2100" height="1300">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0e1e36}.small{font-size:28px}.label{font-size:30px;font-weight:700}.ink{fill:#0e1e36}.muted{fill:#6b778a}.blue{fill:#2f5bd3}.worker{opacity:1}.halo{fill:#e6edff;opacity:0}.operator{opacity:1}.op-halo{fill:#fae9d4}.equipment{opacity:1}</style><title id="room-title">一个打开前墙的工作房间</title><desc id="room-desc">房间中有三位接力写纸条的人。配齐工作条件后，墙上出现规则和工具清单，房间外出现使用电脑的操作员。纸条在人与操作员之间往返。</desc>
