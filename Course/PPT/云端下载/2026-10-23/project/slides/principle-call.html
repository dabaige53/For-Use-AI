<aside>先抛问题，停几秒让学员猜。答案后面用房间的比喻一步步讲：你的消息不会直接到模型，应用先把任务、规则、可用操作打包，通过 API 发给模型；模型只返回文字或操作请求，由应用识别后才执行。以使用云端模型的应用为例。</aside>
