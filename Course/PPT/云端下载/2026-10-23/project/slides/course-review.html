<div style="position:absolute;left:84px;top:260px;width:1752px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px"><div style="display:flex;flex-direction:column;gap:18px;background:#ffffff;border:1px solid #d9dee6;border-radius:12px;padding:36px 34px 40px"><p style="font-size:120px;font-weight:700;line-height:1;color:#e3e9f5">01</p><h3 style="font-size:46px;font-weight:700;line-height:1.3;color:#1f2737">了解它</h3><p style="font-size:34px;font-weight:700;line-height:1.45;color:#3b5ba9">AI 的本质是预测</p><p style="font-size:30px;line-height:1.5;color:#4a5466">说得像不等于说得对，用之前要核对</p></div><div style="display:flex;flex-direction:column;gap:18px;background:#ffffff;border:1px solid #d9dee6;border-radius:12px;padding:36px 34px 40px"><p style="font-size:120px;font-weight:700;line-height:1;color:#e3e9f5">02</p><h3 style="font-size:46px;font-weight:700;line-height:1.3;color:#1f2737">看清它</h3><p style="font-size:34px;font-weight:700;line-height:1.45;color:#3b5ba9">模型提请求，应用来执行</p><p style="font-size:30px;line-height:1.5;color:#4a5466">每次调用都是新人，只读本轮材料</p></div><div style="display:flex;flex-direction:column;gap:18px;background:#ffffff;border:1px solid #d9dee6;border-radius:12px;padding:36px 34px 40px"><p style="font-size:120px;font-weight:700;line-height:1;color:#e3e9f5">03</p><h3 style="font-size:46px;font-weight:700;line-height:1.3;color:#1f2737">用好它</h3><p style="font-size:34px;font-weight:700;line-height:1.45;color:#3b5ba9">把限制、标准、样例写清楚</p><p style="font-size:30px;line-height:1.5;color:#4a5466">看到初稿后再试、再筛、再拉回</p></div></div>
<div style="position:absolute;left:84px;top:850px;width:1752px;display:flex;flex-direction:row;align-items:center;gap:20px"><p style="font-size:69px;font-weight:700;line-height:1.3;color:#1f2737">把 AI 当<span style="color:#a9672e">同事</span></p><div style="width:2px;height:55px;background:#d9dee6"></div><p style="font-size:37px;line-height:1.5;color:#4a5466">交代目标，检查结果，在反馈中磨合</p></div>
<aside>全课回顾。了解它：AI 的回答是一个词一个词预测出来的，说得像不等于说得对，用之前要核对。看清它：模型只能提出请求，真正执行的是应用；每次调用进门的都是新人，只读本轮材料。用好它：把限制、标准、样例写到墙上，看到初稿以后再试、再筛、再拉回。最后回到开场那句话：把 AI 当同事。</aside>
