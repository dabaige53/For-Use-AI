<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="03-context-title 03-context-desc"><title id="03-context-title">本轮输入由多种来源组成</title><desc id="03-context-desc">规则、任务、相关历史、工具定义与取得资料被程序组织成本轮输入；保存不等于选入。</desc><defs><marker id="03-context-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#7A9AB8"/></marker><marker id="03-context-arrow-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#1769AA"/></marker><marker id="03-context-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#163A5F"/></marker></defs><rect width="960" height="600" fill="#FFFFFF"/><text x="40" y="56" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" fill="#163A5F">本轮输入由多种来源组成</text><path d="M 120 208 L 120 328" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)"/><rect x="220" y="144" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="288" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">用户任务</text><path d="M 288 208 L 288 328" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)"/><rect x="392" y="144" width="140" height="64" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="464" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">选取历史</text><path d="M 460 208 L 460 328" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)"/><rect x="560" y="144" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="632" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">工具定义</text><path d="M 632 208 L 632 328" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)"/><rect x="728" y="144" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="800" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">取得资料</text><path d="M 800 208 L 800 328" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)"/><rect x="80" y="328" width="800" height="92" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="480" y="368" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">本轮输入</text><path d="M 288 460 L 304 460 Q 312 460 312 452 L 312 424" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#03-context-arrow)" stroke-dasharray="6 5"/><text x="700" y="452" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="650" fill="#1769AA">保存 ≠ 选入</text><rect x="48" y="144" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="120" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">规则</text><rect x="72" y="432" width="220" height="64" rx="8" fill="#F7FAFC" stroke="#7A9AB8" stroke-width="1.5"/><text x="184" y="456" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">已保存的记录</text><text x="480" y="388" tex