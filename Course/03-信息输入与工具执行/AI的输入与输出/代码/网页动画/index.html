<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 的输入与输出</title>
<style>
  :root {
    --bg: #000;
    --fg: #ececec;
    --dim: #8a9099;
    --line: #2c3036;
    --accent: #58a6ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: "AIIO-serif600", "Noto Serif SC", "Songti SC", serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { display: block; width: 100%; height: 100%; background: #000; }
  #subs {
    position: absolute; left: 50%; bottom: 3.2%; transform: translateX(-50%);
    max-width: 82%; padding: .35em .8em; border-radius: .35em;
    background: rgba(0, 0, 0, .72); color: #f2f2f2; text-align: center;
    font-size: clamp(14px, 2.05vw, 34px); line-height: 1.45; letter-spacing: .02em;
    pointer-events: none; display: none;
  }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .85) 45%);
    font: 14px/1 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: opacity .3s; opacity: 1;
  }
  body.idle #bar { opacity: 0; }
  body:not(.idle) #subs { bottom: calc(3.2% + 52px); }
  button {
    background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px;
    height: 32px; min-width: 40px; padding: 0 10px; cursor: pointer; font: inherit;
  }
  button:hover, button:focus-visible { border-color: var(--dim); outline: none; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #time { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #track { position: relative; flex: 1; height: 32px; display: flex; align-items: center; }
  #seek { width: 100%; accent-color: var(--accent); margin: 0; cursor: pointer; }
  .mark { position: absolute; top: 6px; width: 2px; height: 6px; background: var(--dim); pointer-events: none; }
  #chapter { color: var(--dim); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #big {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55);
    background: rgba(0, 0, 0, .35); cursor: pointer; display: none;
  }
  #big::after {
    content: ""; position: absolute; left: 38px; top: 28px;
    border-style: solid; border-width: 20px 0 20px 32px; border-color: transparent transparent transparent #fff;
  }
  body.paused #big { display: block; }
  body.render #bar, body.render #big, body.render #subs { display: none !important; }
  @media (max-width: 640px) { #chapter { display: none; } #bar { gap: 8px; padding: 8px 10px 12px; } }
</style>
</head>
<body class="paused">
<div id="stage">
  <div id="frame">
    <canvas id="c" width="1920" height="1080" aria-label="AI 的输入与输出 动画"></canvas>
    <div id="subs" aria-live="polite"></div>
    <button id="big" aria-label="播放"></button>
  </div>
</div>
<div id="bar">
  <button id="play" aria-label="播放/暂停">播放</button>
  <span id="time">0:00 / 2:39</span>
  <div id="track"><input id="seek" type="range" min="0" max="159" step="0.0333" value="0" aria-label="进度"></div>
  <span id="chapter"></span>
  <button id="cc" aria-pressed="false" title="字幕 (C)">字幕</button>
  <button id="fs" title="全屏 (F)">全屏</button>
</div>
<audio id="vo" preload="auto"></audio>
<script src="vendor/opentype.min.js"></script>
<script src="fonts/fonts.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/scene.js"></script>
<script src="js/player.js"></script>
</body>
</html>
