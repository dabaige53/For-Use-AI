<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="04-context-selection-title 04-context-selection-desc"><title id="04-context-selection-title">上下文选择服务于当前任务</title><desc id="04-context-selection-desc">从历史与资料中选取相关内容构成本轮输入，无关记录留在保存状态。</desc><defs><marker id="04-context-selection-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#7A9AB8"/></marker><marker id="04-context-selection-arrow-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#1769AA"/></marker><marker id="04-context-selection-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#163A5F"/></marker></defs><rect width="960" height="600" fill="#FFFFFF"/><text x="40" y="56" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" fill="#163A5F">上下文选择服务于当前任务</text><path d="M 320 248 L 384 248 Q 392 248 392 256 L 392 300" fill="none" stroke="#1769AA" stroke-width="2" stroke-linejoin="round" marker-end="url(#04-context-selection-arrow-blue)"/><rect x="320" y="196" width="64" height="24" fill="#FFFFFF"/><text x="352" y="216" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#1769AA">选择</text><path d="M 580 300 L 688 300" fill="none" stroke="#1769AA" stroke-width="2" stroke-linejoin="round" marker-end="url(#04-context-selection-arrow-blue)"/><rect x="688" y="244" width="220" height="112" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="800" y="296" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">本轮输入</text><rect x="40" y="104" width="280" height="408" rx="8" fill="#F7FAFC" stroke="#7A9AB8" stroke-width="1.5"/><text x="180" y="304" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">候选历史与资料</text><rect x="64" y="176" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="180" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">反馈 ID 与原文</text><rect x="64" y="248" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="180" y="276" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">统计口径</text><rect x="64" y="320" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="180" y="348" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">输出约束</text><rect x="64" y="392" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="180" y="420" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">旧草稿 / 闲聊</text><rect x="392" y="232" width="192" height="140" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="488" y="288" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">选择器</text><text x="180" y="320" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">并非全部进入本轮</text><text x="488" y="304" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">相关性 · 边界 · 可</text><text x="488" y="328" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">用性</text><text x="800" y="312" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#536B80">为下次活动改进服务</text><text x="480" y="552" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="500" fill="#536B80">选入：目标、原文、口径、约束　｜　移出：旧草稿、放弃方案、闲聊</text></svg>