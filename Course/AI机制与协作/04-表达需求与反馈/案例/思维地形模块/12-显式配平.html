<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>12 显式配平｜思维地形</title>
<style>
  :root{
    --bg:#f3f5f2;
    --panel:rgba(255,255,255,.95);
    --panel-solid:#ffffff;
    --ink:#17221e;
    --ink-sub:#485751;
    --muted:#72807b;
    --line:#dfe5e1;
    --line-strong:#cfd8d3;
    --accent:#42756b;
    --accent-soft:#e6efec;
    --accent-glow:rgba(66,117,107,.26);
    --token-red:#c05036;
    --token-red-soft:#fbf0ec;
    --token-red-border:#f4cfc0;
    --token-green:#2f7866;
    --token-green-soft:#e8f4ee;
    --token-green-border:#cbe5db;
    --token-blue:#326588;
    --token-blue-soft:#eaf2f7;
    --token-blue-border:#c9dfea;
    --shadow:0 18px 46px rgba(24,40,34,.08);
    --radius:16px;
    --chat-width:390px;
    --side-width:250px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 0%,rgba(255,255,255,.96),transparent 38%),
      linear-gradient(180deg,#f8f9f6 0%,var(--bg) 100%);
    color:var(--ink);
    font-family:Inter,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.is-resizing{cursor:col-resize;user-select:none}
  button,input{font:inherit}
  button{color:inherit}
  .app{height:100%;display:flex;flex-direction:column;padding:8px 12px;gap:8px}

  /* 顶栏 */
  .topbar{
    height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 4px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{
    width:32px;height:32px;border:1px solid var(--line-strong);border-radius:9px;
    display:grid;place-items:center;background:rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(28,44,39,.05)
  }
  .brand-title{font-size:14px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .brand-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:1px solid #cce0d9}
  .brand-sub{color:var(--muted);font-size:10px;white-space:nowrap;margin-left:4px}

  .top-actions{display:flex;align-items:center;gap:6px}
  .icon-btn,.soft-btn,.view-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.85);height:30px;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;
    transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .icon-btn{width:30px;padding:0}.soft-btn{padding:0 9px;font-size:10.5px;font-weight:650}
  .icon-btn:hover,.soft-btn:hover,.view-btn:hover{background:#fff;border-color:var(--line-strong);box-shadow:0 4px 12px rgba(25,38,34,.07)}
  .icon-btn:active,.soft-btn:active,.view-btn:active{transform:translateY(1px)}
  .icon-btn svg,.soft-btn svg,.view-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .soft-btn.active{background:var(--accent-soft);border-color:#cadcd5;color:#29544c}

  /* 视角切换器：提供最佳视角、横向剖面透视（观察低谷深度与山体高差）、俯视视角 */
  .view-group{display:inline-flex;background:#edf2ef;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
  .view-btn{height:24px;padding:0 8px;border:0;background:transparent;border-radius:6px;font-size:10px;font-weight:650;color:var(--muted)}
  .view-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 5px rgba(20,38,30,.08)}

  /* ============================================================
     工作区布局：左侧可调宽对话流 + 中间 3D 画布 + 右侧机制目录
     ============================================================ */
  .workspace{
    min-height:0;flex:1;display:flex;align-items:stretch;gap:0;position:relative;
  }

  /* ------------------------------------------------------------
     左侧：可调宽度真实对话视窗
     ------------------------------------------------------------ */
  .chat-panel{
    width:var(--chat-width);min-width:270px;max-width:620px;flex-shrink:0;height:100%;
    display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);overflow:hidden;
    transition:margin-left .28s cubic-bezier(0.2,0,0,1),opacity .25s ease;
  }
  body.chat-collapsed .chat-panel{margin-left:calc(-1 * var(--chat-width) - 10px);opacity:0;pointer-events:none}

  .chat-panel-head{
    padding:8px 12px 7px;border-bottom:1px solid var(--line);background:#ffffff;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .chat-panel-title{font-size:12.5px;font-weight:750;color:#293a33;display:flex;align-items:center;gap:6px}
  .chat-panel-tip{font-size:9.5px;color:var(--muted);font-weight:600}

  .chat-body{
    min-height:0;flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:11px;
    scrollbar-width:thin;scrollbar-color:#d7dfda transparent;background:#fafbfa;
  }
  .chat-body::-webkit-scrollbar{width:4px}.chat-body::-webkit-scrollbar-thumb{background:#d7dfda;border-radius:10px}

  /* 消息气泡 */
  .chat-msg{display:flex;flex-direction:column;gap:5px;max-width:100%}
  .chat-msg-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:750;color:#5a6863}
  .chat-avatar{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:800}
  .chat-msg.user .chat-avatar{background:#273731;color:#fff}
  .chat-msg.assistant .chat-avatar{background:var(--accent-soft);color:var(--accent);border:1px solid #c9ded6}

  .chat-bubble{
    border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.58;position:relative;
    box-shadow:0 2px 8px rgba(24,40,34,.03);
  }
  .chat-msg.user .chat-bubble{background:#ffffff;border:1px solid rgba(206,218,212,.95);color:#192622;cursor:pointer}
  .chat-msg.user .chat-bubble:hover{border-color:var(--accent)}
  .chat-msg.assistant .chat-bubble{
    background:#ffffff;border:1px solid #dce6e1;color:#243630;display:flex;flex-direction:column;gap:6px;
  }

  /* 浅色说明标签：独立置于文字上方，绝不混入对话内容 */
  .step-meta{display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .step-badge{
    font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:4px;
    display:inline-flex;align-items:center;gap:4px;letter-spacing:.01em;line-height:1.3;
  }
  .step-badge.tag-green{background:var(--token-green-soft);color:var(--token-green);border:1px solid var(--token-green-border)}
  .step-badge.tag-red{background:var(--token-red-soft);color:var(--token-red);border:1px solid var(--token-red-border)}
  .step-badge.tag-blue{background:var(--token-blue-soft);color:var(--token-blue);border:1px solid var(--token-blue-border)}

  /* 可点击的步骤节点（点击流转至对应阶段） */
  .step-node{
    display:flex;flex-direction:column;gap:2px;cursor:pointer;padding:4px 6px;border-radius:6px;border:1px solid transparent;
    transition:background .15s ease,border-color .15s ease;
  }
  .step-node:hover{background:#f0f5f2;border-color:#d4e2db}
  .step-node.active-step{background:#eaf3ef;border-color:#b8d6cb}

  .step-text{padding-left:13px;position:relative;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .step-text:before{content:"●";position:absolute;left:0;top:1px;font-size:8px;color:#85958f}
  .step-node.noise .step-text{color:#1f2e29}
  .step-node.noise .step-text:before{color:var(--token-red)}

  .step-cmd{
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10.5px;
    background:#202b27;color:#a8e6cf;padding:4px 8px;border-radius:5px;margin:3px 0 2px;display:block;word-break:break-all;
  }
  .step-cmd:before{content:"$ ";opacity:.5;color:#fff}
  .step-err{background:#fdf2ef;border:1px solid #f6cfc1;color:#b94f35;padding:3px 7px;border-radius:4px;font-size:10px;margin:2px 0}

  /* 底部独立总结卡片：不在 AI 会话内部展示，固定在会话最下方 */
  .chat-summary-wrap{
    padding:9px 12px;border-top:1px solid var(--line);background:#fff9f6;
    display:flex;flex-direction:column;gap:3px;cursor:pointer;
    transition:background .2s ease,border-color .2s ease,opacity .25s ease;
  }
  .chat-summary-wrap:hover{background:#fff3ed}
  .chat-summary-wrap.success{background:#f3f9f6}
  .chat-summary-wrap.success:hover{background:#eaf6f0}
  .chat-summary-head{display:flex;align-items:center;justify-content:space-between}
  .chat-summary-tag{font-size:10px;font-weight:750;padding:2px 7px;border-radius:4px;background:#fde8e1;color:#b2472d;border:1px solid #f9cfc2}
  .chat-summary-wrap.success .chat-summary-tag{background:#e0f4ea;color:#276b58;border-color:#c4e8d6}
  .chat-summary-flow-tip{font-size:9px;color:var(--muted);font-weight:600}
  .chat-summary-text{font-size:12px;line-height:1.55;color:#2c3a34;font-weight:600}

  /* 对话底部演化控制条 */
  .chat-footer{
    padding:6px 12px 8px;border-top:1px solid var(--line);background:#ffffff;
    display:flex;flex-direction:column;gap:5px;
  }
  .chat-footer-controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chat-play-btn{
    width:26px;height:26px;border-radius:50%;border:0;background:#202e29;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .18s ease,transform .12s ease;flex-shrink:0;
  }
  .chat-play-btn:hover{background:#314841;transform:scale(1.06)}
  .chat-play-btn:active{transform:scale(0.94)}
  .chat-play-btn svg{width:11px;height:11px;display:block}

  .chat-replay-btn{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;
    display:inline-flex;align-items:center;justify-content:center;color:#4f5e58;cursor:pointer;
    transition:background .18s ease,color .18s ease,transform .12s ease;flex-shrink:0;
  }
  .chat-replay-btn:hover{background:#f3f7f5;color:var(--accent);transform:scale(1.06)}
  .chat-replay-btn:active{transform:scale(0.94)}
  .chat-replay-btn svg{width:11px;height:11px;display:block}

  .range-wrap{position:relative;width:100%;height:10px;display:flex;align-items:center}
  #progressRange{width:100%;height:10px;margin:0;appearance:none;background:transparent;cursor:pointer}
  #progressRange::-webkit-slider-runnable-track{height:3px;border-radius:10px;background:linear-gradient(90deg,var(--accent) 0 var(--progress,0%),#dfe5e1 var(--progress,0%) 100%)}
  #progressRange::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--accent);margin-top:-4px;box-shadow:0 1px 4px rgba(34,52,46,.2)}

  /* ------------------------------------------------------------
     分割拖拽条：平滑调节左侧对话框宽度
     ------------------------------------------------------------ */
  .chat-resizer{
    width:8px;margin:0 1px;cursor:col-resize;position:relative;z-index:15;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .chat-resizer:hover,.chat-resizer.is-active{background:rgba(66,117,107,.15)}
  .chat-resizer:after{
    content:"";width:2px;height:24px;border-radius:2px;background:#c8d4cd;transition:background .15s ease;
  }
  .chat-resizer:hover:after,.chat-resizer.is-active:after{background:var(--accent)}

  /* ------------------------------------------------------------
     中间：3D 思维地形主视口（开阔无遮挡）
     ------------------------------------------------------------ */
  .visual-shell{
    min-width:0;min-height:0;flex:1;position:relative;overflow:hidden;border:1px solid var(--line);
    border-radius:var(--radius);background:#f6f8f5;box-shadow:var(--shadow);isolation:isolate;
  }
  .visual-shell:before{
    content:"";position:absolute;inset:auto 10% 2% 10%;height:22%;z-index:0;
    background:radial-gradient(ellipse at center,rgba(66,87,78,.14),transparent 68%);filter:blur(22px);pointer-events:none
  }
  #glCanvas,#overlayCanvas{position:absolute;inset:0;width:100% !important;height:100% !important;display:block}
  #glCanvas{z-index:1;touch-action:none}
  #overlayCanvas{z-index:3;pointer-events:none}
  .visual-tint{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.30),transparent 20%,transparent 78%,rgba(246,248,245,.28));
  }

  /* 折叠左右侧栏的快捷按钮 */
  .panel-toggle-btn{
    position:absolute;z-index:9;top:12px;width:28px;height:28px;border-radius:7px;
    border:1px solid rgba(206,218,212,.95);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
    display:grid;place-items:center;cursor:pointer;color:#495a53;box-shadow:0 2px 8px rgba(22,38,32,.07);
    transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
  }
  .panel-toggle-btn:hover{background:#fff;border-color:var(--accent);color:var(--accent)}
  .panel-toggle-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #toggleChatBtn{left:12px}
  #toggleSideBtn{right:12px}

  /* 3D 浮动地标 */
  .marker-label{
    position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-100%);padding:3px 6px;border-radius:5px;
    border:1px solid rgba(207,217,212,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);font-size:8.5px;font-weight:700;color:#3c4944;
    box-shadow:0 3px 8px rgba(29,44,38,.06);white-space:nowrap;transition:opacity .25s ease;opacity:0;
  }
  .marker-label:after{content:"";position:absolute;left:50%;bottom:-3px;width:5px;height:5px;background:inherit;border-right:1px solid rgba(207,217,212,.9);border-bottom:1px solid rgba(207,217,212,.9);transform:translateX(-50%) rotate(45deg)}
  #startLabel{color:#4f5f59}#targetLabel{color:#276657}#resultLabel.warning{color:#9d5b28}#resultLabel.success{color:#276657}
  #resultLabel{transform:translate(18px,8px)}

  /* 3D 悬浮标注钉（点击流转至指定阶段） */
  .annotation-layer{position:absolute;inset:0;z-index:7;pointer-events:none}
  .annotation-pin{
    position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px 4px 5px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(204,218,211,.98);
    box-shadow:0 5px 18px rgba(24,40,34,.12);pointer-events:auto;cursor:pointer;
    transition:opacity .25s ease,transform .2s ease,box-shadow .2s ease,border-color .2s ease;white-space:nowrap;user-select:none;
  }
  .annotation-pin:hover{transform:translate(-50%,-50%) translateY(-2px);background:#fff;box-shadow:0 8px 22px rgba(24,40,34,.18)}
  .annotation-pin.active{background:#fff;border-color:var(--accent);box-shadow:0 6px 20px var(--accent-glow);transform:translate(-50%,-50%) scale(1.05)}
  .annotation-pin.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.8)}

  .annotation-token-badge{
    font-size:9px;font-weight:750;padding:2px 5px;border-radius:4px;background:#f0f4f2;color:#395b52;border:1px solid #d4dfda;
  }
  .annotation-pin.tag-red .annotation-token-badge{background:var(--token-red-soft);color:var(--token-red);border-color:#f0d5ca}
  .annotation-pin.tag-green .annotation-token-badge{background:var(--token-green-soft);color:var(--token-green);border-color:#c9e3db}
  .annotation-pin.tag-blue .annotation-token-badge{background:var(--token-blue-soft);color:var(--token-blue);border-color:#cfdfeb}
  .annotation-arrow{font-size:8px;color:#95a29c}
  .annotation-text{font-size:9.5px;font-weight:700;color:#283832}

  .help-tip{
    position:absolute;z-index:6;right:14px;bottom:12px;font-size:9px;color:#7e8b85;
    background:rgba(255,255,255,.76);backdrop-filter:blur(8px);padding:3px 8px;border-radius:6px;border:1px solid rgba(215,224,220,.8);pointer-events:none
  }

/* 二维原著图解卡片（纯净无文字底噪，点击向右上角平滑放大展开） */
  .aux-diagram{
    position:absolute;z-index:20;left:14px;bottom:16px;width:210px;height:118px;
    border:1px solid rgba(206,218,212,.95);border-radius:10px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:4px;box-shadow:0 4px 14px rgba(24,40,34,.08);
    cursor:pointer;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;
    transition:width .32s cubic-bezier(0.16,1,0.3,1),height .32s cubic-bezier(0.16,1,0.3,1),box-shadow .25s ease,border-color .2s ease;
  }
  .aux-diagram:hover:not(.is-expanded){
    border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(24,40,34,.14);
  }
  .aux-diagram.is-expanded{
    width:480px;height:272px;
    max-width:calc(100% - 28px);max-height:calc(100% - 72px);
    z-index:50;background:rgba(255,255,255,.98);border-color:var(--accent);
    box-shadow:0 20px 50px rgba(18,36,28,.22);
    padding:6px;
  }

  .aux-svg-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden}
  .aux-svg-container svg, .aux-diagram svg{width:100%;height:100%;display:block}
  .aux-svg-container text, .aux-diagram text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#354740}
  .aux-svg-container .aux-title, .aux-diagram .aux-title{font-size:10px;font-weight:800;fill:#22362f}
  .aux-svg-container .aux-text, .aux-diagram .aux-text{font-size:7.5px;font-weight:700;fill:#65756e}

  /* 核心状态隔离：杜绝前后两张图片重叠 */
  .aux-after, .aux-diagram .aux-after, .aux-svg-container .aux-after, svg .aux-after{display:none !important}
  body.compare-after .aux-before, body.compare-after .aux-diagram .aux-before, body.compare-after .aux-svg-container .aux-before, body.compare-after svg .aux-before{display:none !important}
  body.compare-after .aux-after, body.compare-after .aux-diagram .aux-after, body.compare-after .aux-svg-container .aux-after, body.compare-after svg .aux-after{display:inline !important}

  @media(max-width:900px){.aux-diagram:not(.is-expanded){width:170px;height:98px;left:8px;bottom:12px}}

  /* ------------------------------------------------------------
     右侧：机制目录与理论本质（严格遵从原文原话，无“定义：”，纯净标题）
     ------------------------------------------------------------ */
  .side-panel{
    width:var(--side-width);min-width:230px;flex-shrink:0;height:100%;margin-left:8px;
    display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);overflow:hidden;
    transition:margin-right .28s cubic-bezier(0.2,0,0,1),opacity .25s ease;
  }
  body.side-collapsed .side-panel{margin-right:calc(-1 * var(--side-width) - 10px);opacity:0;pointer-events:none}

    /* 地图上方悬浮卡片：思维框架理论与导航（无阴影、毛玻璃设计） */
  .map-selection-card{
    position:absolute;z-index:7;top:12px;left:50%;transform:translateX(-50%);
    width:min(640px,calc(100% - 96px));
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;
    padding:8px 14px 7px;box-shadow:none !important;
    display:flex;flex-direction:column;gap:5px;
    transition:border-color .2s ease;
  }
  body.visual-only .map-selection-card{display:none !important}

  .selection-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .selection-title-wrap{display:flex;align-items:center;gap:7px;min-width:0}
  .selection-index{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .map-selection-card h1{font-size:16px;line-height:1.2;margin:0;font-weight:800;color:#182823;letter-spacing:-.01em;white-space:nowrap}
  .selection-badge{font-size:9.5px;font-weight:750;color:var(--accent);background:var(--accent-soft);border:1px solid #cfdfda;border-radius:999px;padding:1px 7px;white-space:nowrap}
  .selection-nav{display:flex;align-items:center;gap:5px;flex-shrink:0}
  .selection-nav-btn{

      const isGood = activeAlert.type === 'good';
      summaryWrap.className = 'chat-summary-wrap ' + (isGood ? 'success' : '');
      summaryTag.textContent = isGood ? '干预方案与成效' : '偏航成因诊断';
      summaryWrap.onclick = () => flowToStage(activeAlert.time || 1);
    } else {
      summaryWrap.style.display = 'none';
    }

    // 点击步骤流转至对应时间点
    container.querySelectorAll('[data-step-time]').forEach(node=>{
      node.addEventListener('click',e=>{
        e.stopPropagation();
        flowToStage(+node.dataset.stepTime);
      });
    });

    container.querySelectorAll('.chat-msg.user').forEach(userMsg=>{
      userMsg.addEventListener('click',()=>{
        flowToStage(+userMsg.dataset.flowTime);
      });
    });
  }

  function updateDialogueVisibility(){
    const container=document.getElementById('chatBody');
    container.querySelectorAll('.chat-msg').forEach(msg=>{
      const minT=+msg.dataset.minTime;
      const showMsg=progress>=minT;
      msg.style.display=showMsg?'flex':'none';
      if(showMsg){
        let lastActiveStep=null;
        msg.querySelectorAll('[data-step-time]').forEach(step=>{
          const st=+step.dataset.stepTime;
          const isPast = progress>=st;
          step.style.display=isPast?'block':'none';
          if(isPast) lastActiveStep=step;
          step.classList.remove('active-step');
        });
        if(lastActiveStep) lastActiveStep.classList.add('active-step');
      }
    });

    // 底部总结卡片渐进高亮
    const summaryWrap = document.getElementById('chatSummaryWrap');
    if(activeAlert && summaryWrap){
      const reached = progress >= (activeAlert.time || 0.85);
      summaryWrap.style.opacity = reached ? '1' : '0.45';
      summaryWrap.style.filter = reached ? 'none' : 'grayscale(0.6)';
    }

    document.getElementById('chatProgressPercent').textContent = Math.round(progress * 100) + '%';
  }

  function updateProgressUI(){
    const v=Math.round(progress*1000);
    const pct=(progress*100).toFixed(1)+'%';
    const pctInt=Math.round(progress*100)+'%';

    const range=document.getElementById('progressRange');
    if(range){
      range.value=v;
      range.style.setProperty('--progress',pct);
    }
    const vRange=document.getElementById('visualProgressRange');
    if(vRange){
      vRange.value=v;
      vRange.style.setProperty('--progress',pct);
    }

    updateDialogueVisibility();

    const playIconSvg=playing
      ?'<rect x="6" y="5" width="3.5" height="14" rx="1.2" fill="currentColor"/><rect x="14.5" y="5" width="3.5" height="14" rx="1.2" fill="currentColor"/>'
      :'<path d="M7 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 7 5.5z" fill="currentColor"/>';

    const pIcon=document.getElementById('playIcon');
    if(pIcon) pIcon.innerHTML=playIconSvg;
    const playBtn=document.getElementById('playBtn');
    if(playBtn){
      playBtn.title=playing?'暂停演进':'继续演进';
      playBtn.setAttribute('aria-label',playing?'暂停演进':'继续演进');
    }

    const vpIcon=document.getElementById('visualPlayIcon');
    if(vpIcon) vpIcon.innerHTML=playIconSvg;
    const vPlayBtn=document.getElementById('visualPlayBtn');
    if(vPlayBtn){
      vPlayBtn.title=playing?'暂停演进':'继续演进';
      vPlayBtn.setAttribute('aria-label',playing?'暂停演进':'继续演进');
    }

    const pPct=document.getElementById('chatProgressPercent');
    if(pPct) pPct.textContent=pctInt;
    const vpPct=document.getElementById('visualProgressPercent');
    if(vpPct) vpPct.textContent=pctInt;
  }

  /* ============================================================
     右侧思维地貌矩阵渲染（2列精致交互卡片，告别枯燥目录设计）
     ============================================================ */
  function renderMatrix(){
    const grid=document.getElementById('matrixGrid');
    if(!grid) return;
    grid.innerHTML=moduleCatalog.map(f=>{
      const num=f.index<10?'0'+f.index:''+f.index;
      const isActive=f.id===current.id;
      const group=f.index===1?'<div class="matrix-group-label">性质 · 宏观行为特征</div>':f.index===7?'<div class="matrix-group-label">技巧 · 基础使用方法</div>':'';
      return `
        ${group}
        <a class="matrix-card ${isActive?'active':''}" href="${f.href}" title="切换到 ${f.title}" ${isActive?'aria-current="page"':''}>
          <span class="matrix-card-num">${num}</span>
          <span class="matrix-card-name">${f.title}</span>
        </a>
      `;
    }).join('');
  }

  function toggleAuxExpand(forceState){
    const aux = document.getElementById('auxDiagram');
    if(!aux) return;
    const isExp = forceState !== undefined ? forceState : !aux.classList.contains('is-expanded');
    aux.classList.toggle('is-expanded', isExp);
  }

  function renderAuxDiagram(){
    const aux = document.getElementById('auxDiagram');
    if(!aux) return;
    const svg = auxDiagramSvgs[current.id];
    let container = document.getElementById('auxSvgContainer') || aux.querySelector('.aux-svg-container');
    if(!container){
      container = document.createElement('div');
      container.className = 'aux-svg-container';
      container.id = 'auxSvgContainer';
      aux.appendChild(container);
    }
    if(container && svg){
      container.innerHTML = svg;
    }
  }

  function setupAuxExpand(){
    const aux = document.getElementById('auxDiagram');
    if(!aux) return;

    aux.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAuxExpand();
    });

    document.addEventListener('click', (e) => {
      if(aux.classList.contains('is-expanded') && !aux.contains(e.target)){
        toggleAuxExpand(false);
      }
    });

    window.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){
        toggleAuxExpand(false);
      }
    });
  }

  function updateSelection(){
    document.body.classList.toggle('compare-after',compareAfter);
    document.documentElement.style.setProperty('--accent',current.accent);
    document.documentElement.style.setProperty('--accent-soft',current.accent+'18');
    document.documentElement.style.setProperty('--accent-glow',current.accent+'38');

    document.getElementById('selectionIndex').textContent=(current.index<10?'0'+current.index:''+current.index)+' / 20';
    document.getElementById('selectionBadge').textContent=current.index<=6?'性质 · 宏观行为特征':'技巧 · 基础使用方法';
    document.getElementById('selectionTitle').textContent=current.title;
    const comparison=techniqueComparisons[current.id];
    document.getElementById('selectionDesc').textContent=current.desc;
    const compareSwitch=document.getElementById('compareSwitch');
    compareSwitch.classList.toggle('visible',!!comparison);
    const rawLabel=compareAfter?(comparison?.afterLabel||'使用技巧后'):(comparison?.beforeLabel||'未使用技巧');
    const cleanLabel=rawLabel.replace(/^(当前|正在)演示\s*·\s*/,'');
    document.getElementById('compareState').textContent='当前演示 · ' + cleanLabel;
    document.getElementById('compareToggle').textContent=compareAfter?'← 查看使用前':'查看使用后 →';
    const compareDesc=document.getElementById('compareDesc');
    if(compareDesc && comparison){
      compareDesc.textContent=compareAfter?comparison.after:comparison.before;
    }

    const vTitle=document.getElementById('visualBarTitle');
    if(vTitle) vTitle.textContent=current.title;
    const vBadge=document.getElementById('visualBarBadge');
    if(vBadge) vBadge.textContent='思维框架';

    const target=document.getElementById('targetLabel');
    target.textContent=comparison&&!compareAfter?(comparison.beforeTarget||'更优解（当前不可达）'):(current.targetLabel||'目标正确山谷');

    const result=document.getElementById('resultLabel');
    const beforeTechnique=current.index>=7&&!compareAfter;
    result.textContent=beforeTechnique?(comparison.beforeResult||'当前局部最优'):current.result;
    result.className='marker-label '+(beforeTechnique?'warning':current.success?'success':'warning');

    renderDialogueChat();
    renderAnnotationPins();
    renderAuxDiagram();
    renderAuxDiagram();
    renderAuxDiagram();
    renderAuxDiagram();
    renderAuxDiagram();
    renderAuxDiagram();
    renderMatrix();
    updateProgressUI();
  }

  document.getElementById('compareToggle').addEventListener('click',()=>{
    if(!techniqueComparisons[current.id])return;
    compareAfter=!compareAfter;progress=0;playing=true;
    updateSelection();
  });

  /* ============================================================
     视角控制机制：
     - best: 最佳立体全景视角
     - profile: 横向剖面透视视角，以近水平切线观察低谷深度与山体高差
     - top: 全局俯视视角
     ============================================================ */
  function setCameraView(mode){
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    if(mode==='best'){
      document.getElementById('viewBestBtn').classList.add('active');
      applyCameraPreset(cameraPresets[current.id]||{theta:-.70,phi:1.02,dist:9.2});
    } else if(mode==='profile'){
      document.getElementById('viewProfileBtn').classList.add('active');
      const p = profilePresets[current.id] || { theta: -2.32, phi: 1.38, dist: 8.5 };
      applyCameraPreset(p);
    } else if(mode==='top'){
      document.getElementById('viewTopBtn').classList.add('active');
      applyCameraPreset({theta:-Math.PI/2,phi:0.42,dist:10.5});
    }
  }

  document.getElementById('viewBestBtn').addEventListener('click',()=>setCameraView('best'));
  document.getElementById('viewProfileBtn').addEventListener('click',()=>setCameraView('profile'));
  document.getElementById('viewTopBtn').addEventListener('click',()=>setCameraView('top'));
  document.getElementById('resetCamBtn').addEventListener('click',()=>setCameraView('best'));

  /* ============================================================
     主循环与交互监听
     ============================================================ */
  function draw(timeMs){
    const dt=Math.min(.05,(timeMs-lastTime)/1000||0);lastTime=timeMs;
    if(playing){
      progress+=dt/16.0;
      if(progress>=1){progress=1;playing=false}
      updateProgressUI();
    }
    updateCamera(dt);
    resize();
    const seconds=timeMs/1000;
    updateTerrain(seconds);
    drawTerrain();
    drawOverlay(seconds);
    positionAnnotations(seconds);
    requestAnimationFrame(draw);
  }

  glCanvas.addEventListener('pointerdown',e=>{
    pointer={id:e.pointerId,x:e.clientX,y:e.clientY,theta:camera.targetTheta,phi:camera.targetPhi};
    glCanvas.setPointerCapture(e.pointerId);
    lastInteraction=performance.now();
  });
  glCanvas.addEventListener('pointermove',e=>{
    if(!pointer||pointer.id!==e.pointerId)return;
    const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;
    camera.targetTheta=pointer.theta-dx*.006;
    camera.targetPhi=clamp(pointer.phi+dy*.005,.38,1.45);
    lastInteraction=performance.now();
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  });
  glCanvas.addEventListener('pointerup',e=>{if(pointer&&pointer.id===e.pointerId)pointer=null;lastInteraction=performance.now()});
  glCanvas.addEventListener('pointercancel',()=>pointer=null);
  glCanvas.addEventListener('wheel',e=>{
    e.preventDefault();
    camera.targetDist=clamp(camera.targetDist+e.deltaY*.007,6.2,14.5);
    lastInteraction=performance.now();
  },{passive:false});

  /* 控制按钮 */
  document.getElementById('playBtn').addEventListener('click',()=>{
    if(progress>=.999)progress=0;
    playing=!playing;
    updateProgressUI();
  });
  document.getElementById('replayBtn').addEventListener('click',()=>{
    progress=0;playing=true;updateProgressUI();
  });
  document.getElementById('progressRange').addEventListener('input',e=>{
    progress=+e.target.value/1000;playing=false;updateProgressUI();
  });

  /* 顶栏开关 */
  document.getElementById('clinicToggleBtn').addEventListener('click',e=>{
    const on=!annotationLayer.classList.contains('hidden-layer');
    annotationLayer.classList.toggle('hidden-layer',on);
    annotationLayer.style.display=on?'none':'block';
    e.currentTarget.classList.toggle('active',!on);
  });
  document.getElementById('visualBtn').addEventListener('click',e=>{
    const on=document.body.classList.toggle('visual-only');
    e.currentTarget.classList.toggle('active',on);
    resize();
    setTimeout(resize,50);
    setTimeout(resize,250);
  });

  /* 纯视觉专属悬浮控制条事件绑定 */
  document.getElementById('visualPlayBtn').addEventListener('click',()=>{
    if(progress>=.999)progress=0;
    playing=!playing;
    updateProgressUI();
  });
  document.getElementById('visualReplayBtn').addEventListener('click',()=>{
    progress=0;playing=true;updateProgressUI();
  });
  document.getElementById('visualProgressRange').addEventListener('input',e=>{
    progress=+e.target.value/1000;playing=false;updateProgressUI();
  });
  const moduleSiblings = {prev:'11-隐式语义优于显式语义.html', next:'13-知识冗余.html'};
  const navigateFramework = delta => {
    window.location.href = delta < 0 ? moduleSiblings.prev : moduleSiblings.next;
  };
  document.getElementById('visualPrevBtn')?.addEventListener('click', () => navigateFramework(-1));
  document.getElementById('visualNextBtn')?.addEventListener('click', () => navigateFramework(1));
  document.getElementById('sidePrevBtn')?.addEventListener('click', () => navigateFramework(-1));
  document.getElementById('sideNextBtn')?.addEventListener('click', () => navigateFramework(1));

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape' && document.body.classList.contains('visual-only')){
      document.body.classList.remove('visual-only');
      document.getElementById('visualBtn').classList.remove('active');
      resize();
      setTimeout(resize,50);
    }
  });

  /* 侧栏折叠按钮 */
  document.getElementById('toggleChatBtn').addEventListener('click',()=>{
    document.body.classList.toggle('chat-collapsed');
    setTimeout(resize,320);
  });
  document.getElementById('toggleSideBtn').addEventListener('click',()=>{
    document.body.classList.toggle('side-collapsed');
    setTimeout(resize,320);
  });

  /* ============================================================
     拖拽手柄：平滑调节左侧对话框宽度
     ============================================================ */
  const resizer = document.getElementById('chatResizer');
  let isResizing = false;

  resizer.addEventListener('pointerdown', e => {
    isResizing = true;
    resizer.setPointerCapture(e.pointerId);
    resizer.classList.add('is-active');
    document.body.classList.add('is-resizing');
  });

  window.addEventListener('pointermove', e => {
    if (!isResizing) return;
    const offset = e.clientX - 12;
    const newWidth = Math.max(270, Math.min(620, offset));
    document.documentElement.style.setProperty('--chat-width', newWidth + 'px');
    resize();
  });

  window.addEventListener('pointerup', e => {
    if (isResizing) {
      isResizing = false;
      resizer.classList.remove('is-active');
      document.body.classList.remove('is-resizing');
      resize();
    }
  });


  window.addEventListener('resize',resize);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;progress=1}

  /* 启动 */
  setupAuxExpand();
  renderAuxDiagram();
  updateSelection();
  applyCameraPreset(cameraPresets[current.id],true);
  resize();
  updateTerrain(0);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
