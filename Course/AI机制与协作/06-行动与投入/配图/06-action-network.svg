><path d="M 240 352 L 240 432" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#06-action-network-arrow)"/><path d="M 688 208 L 688 288" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#06-action-network-arrow)"/><path d="M 688 352 L 688 432" fill="none" stroke="#7A9AB8" stroke-width="2" stroke-linejoin="round" marker-end="url(#06-action-network-arrow)"/><rect x="160" y="144" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="240" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">提问</text><rect x="608" y="144" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="688" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">研究</text><rect x="160" y="288" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="240" y="324" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">比较</text><rect x="608" y="288" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="688" y="324" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">原型</text><rect x="160" y="432" width="160" height="64" rx="8" fill="#EAF4FB" stroke="#1769AA" stroke-width="2"/><text x="240" y="468" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#18324A">验证</text><rect x="608" y="432" width="160" height="64" rx="8" fill="#FFFFFF" stroke="#7A9AB8" stroke-width="1.5"/><text x="688" y="468" text-anchor="middle" font-family="'Pi