<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行动与投入 · 四象限</title>
<style>
:root{--viz-series-1:#526dad;--viz-series-2:#47796e;--viz-series-3:#9b793b;--viz-series-4:#aa645b}*{box-sizing:border-box}body{margin:0;background:#eceeef;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#24282b}.stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:#fff;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}svg:active{cursor:grabbing}text{fill:#34393d;font-family:inherit}.axis{stroke:#969da3;stroke-width:1}.grid{stroke:#e9ecef;stroke-width:.65}.request{cursor:pointer}.request text{paint-order:stroke;stroke:#fff;stroke-width:3;stroke-linejoin:round}.toolbar{position:absolute;top:2%;right:2%;display:flex;align-items:center;gap:5px;font-size:12px}button{font:inherit;background:white;border:1px solid #e2e5e8;border-radius:5px;padding:5px 9px;color:#515a63;cursor:pointer}button:hover{background:#f4f6f8}button:focus-visible{outline:2px solid #526dad}button:disabled{opacity:.4;cursor:default}#scale{min-width:42px;text-align:center}.status{position:absolute;bottom:1.5%;left:3%;font-size:clamp(7px,.8vw,12px);color:#7c8389;pointer-events:none}
</style></head><body><main class="stage" aria-label="可缩放的行动与投入四象限"><svg id="plot" viewBox="0 0 1600 900" role="img" aria-label="四象限内展示45个AI请求，按逐项评分定位；滚轮缩放，拖动平移。"></svg><div class="toolbar"><button id="minus" aria-label="缩小">−</button><span id="scale">100%</span><button id="plus" aria-label="放大">＋</button><button id="home">总览</button></div><div class="status" id="status" aria-live="polite">滚轮缩放 · 拖动平移 · 双击象限放大　｜　编辑性评分，非实测；点击查看依据。投入按任务相对规模估算。</div></main><script>
const groups=[
{name:'探索',color:'var(--viz-series-1)',cx:-.5,cy:-.5,items:['先问我几个问题，帮我想清楚。','用一个例子解释这个概念。','这两个东西有什么区别？','我这样理解对吗？','有没有我没想到的问题？','查一下这个说法有没有依据。','找几个类似案例给我看看。','给我几个不同的做法。','这两种方案各有什么问题？','先查查这个功能能不能实现。','先列个提纲，我看看。','先写一小段，试试语气。','换两种写法给我比较。','把我的想法整理一下。','先用一页讲清楚这件事。','先出几张图，我看看风格。','按这张参考图，试一版。','用九宫格画出动画过程。','先做一小段动画，我看看节奏。','把这两个画面放一起比较。','用 HTML 搭个草稿，我点点看。','先做一个页面，看看布局。','换一种排版给我看看。','先模拟一下按钮点下去的效果。','放到手机上，看看好不好用。','拿几条数据试算一下。','写个小脚本，看看能不能跑通。','试试这个接口能不能拿到数据。','换几条特殊数据，看看会不会出错。','先处理几个文件，我核对一下。']},
{name:'轻量交付',color:'var(--viz-series-2)',cx:-.5,cy:.5,items:['照这张参考图，做一张海报。','按这个模板，整理一页报告。','按这条规则，处理这份表格。','把这段文字改短，意思不变。','把这个按钮改成蓝色。']},
{name:'深度建设',color:'var(--viz-series-3)',cx:.5,cy:.5,items:['样片可以，按这个效果做完整视频。','原型定了，把整套网站做出来。','计算核对过了，处理全部数据。','提纲和样章定了，完成整套课程。','流程跑通了，把它做成自动化工具。']},
{name:'高暴露',color:'var(--viz-series-4)',cx:.5,cy:-.5,items:['帮我做个能赚钱的 App，功能你定。','把公司所有业务都自动化。','做一套预测模型，明天赚到一百万。','做一整套视频，保证每条都能火。','再全部重做一遍，做到我满意。']}];

const svg=document.getElementById('plot'),ns='http://www.w3.org/2000/svg';
const bounds={l:64,r:1536,t:78,b:840},mid={x:800,y:459};let k=1,cx=800,cy=459,drag=null;
const assessments=[[5, 10, "目标仍待澄清；先用几轮提问获得方向。"], [10, 40, "解释对象已给出；受众理解程度和解释标准未验证。"], [15, 40, "比较对象明确；比较维度仍待选择。"], [5, 35, "已有理解可核对；正确性还需检验。"], [10, 15, "开放寻找盲点；范围和判断标准尚宽。"], [20, 45, "待核查命题明确；需要检索并核对来源。"], [25, 25, "先收集案例；相似性的标准仍需比较。"], [15, 20, "目标有初步方向；方案选择尚未收敛。"], [25, 40, "已有两个方案；优先级和取舍依据仍需确认。"], [30, 35, "功能对象已提出；可行性需要资料或试验。"], [10, 30, "用提纲确认结构；尚不扩写正文。"], [15, 30, "用短文试语气；风格仍待反馈。"], [20, 30, "比较两种表达；选择标准还在形成。"], [10, 25, "已有想法材料；组织方式尚未确认。"], [25, 35, "篇幅限定一页；核心信息与表达仍待验证。"], [30, 20, "生成少量图探索风格；视觉方向尚开放。"], [25, 60, "已有参考图提供视觉依据；先做一版验证贴合程度。"], [35, 40, "九宫格限定试作范围；分镜逻辑仍待观看验证。"], [45, 30, "短动画比静态稿投入高；节奏仍待反馈。"], [10, 45, "两个画面已存在；只需并置比较。"], [40, 25, "制作可点击草稿；交互和需求仍在探索。"], [35, 30, "范围限定单页；布局等待确认。"], [20, 35, "基于已有排版尝试替代；尚未定稿。"], [30, 40, "按钮行为有具体对象；先模拟而不接入完整流程。"], [25, 45, "已有界面可检查；手机体验需要实际观看。"], [15, 45, "以少量数据核对计算；规则正确性待确认。"], [30, 30, "小脚本限制工作范围；能否跑通尚无证据。"], [20, 40, "接口与目标数据具体；可用性等待调用验证。"], [25, 50, "已有实现与测试对象；特殊输入的边界行为仍需验证。"], [20, 50, "已有文件处理目标；先核对样本结果再扩大。"], [30, 70, "有参考图与单张海报范围；验收细节仍可能有歧义。"], [20, 80, "模板和一页范围明确；结果可对照模板核验。"], [25, 85, "处理规则与输入表格明确；可按规则逐项核对。"], [15, 70, "缩短与保留原意有明确约束；压缩程度尚有弹性。"], [5, 90, "对象和修改项具体；颜色深浅仍可能需要补充。"], [80, 85, "样片已获认可；投入扩大到完整视频制作。"], [90, 80, "原型已定；全站实现仍涉及集成和验收。"], [70, 90, "计算已经核对；工作扩展到全量数据。"], [95, 85, "提纲与样章已定；完整课程涉及持续创作和审校。"], [85, 75, "流程已跑通；工具化还需异常处理与维护设计。"], [85, 10, "只给盈利愿望且功能未定；按完整App落地估算投入。"], [100, 15, "只给全业务范围；按企业级改造估算投入，流程标准缺失。"], [90, 5, "收益承诺无法作为可验证的模型验收依据；按建模部署估算投入。"], [80, 5, "逐条爆火是外部结果；按整套视频制作估算投入。"], [75, 10, "满意缺少可复用标准；按整项返工估算投入。"]];
const tasks=[];let assessmentIndex=0;
groups.forEach(g=>g.items.forEach(label=>{const [investment,alignment,reason]=assessments[assessmentIndex++];const quadrant=groups[alignment>=50?(investment>=50?2:1):(investment>=50?3:0)];tasks.push({label,g:quadrant,investment,alignment,reason,x:bounds.l+investment/100*(bounds.r-bounds.l),y:bounds.b-alignment/100*(bounds.b-bounds.t)});}));
function el(tag,a={},text){const e=document.createElementNS(ns,tag);for(const [key,value]of Object.entries(a))e.setAttribute(key,value);if(text!==undefined)e.textContent=text;return e;}
function pos(x,y){return[mid.x+(x-cx)*k,mid.y+(y-cy)*k];}
function draw(){svg.replaceChildren();const defs=el('defs'),clip=el('clipPath',{id:'frame'});clip.append(el('rect',{x:bounds.l,y:bounds.t,width:bounds.r-bounds.l,height:bounds.b-bounds.t}));defs.append(clip);svg.append(defs);const world=el('g',{'clip-path':'url(#frame)'});svg.append(world);
for(let i=0;i<=10;i++){let a=pos(bounds.l+i*(bounds.r-bounds.l)/10,bounds.t),b=pos(bounds.l+i*(bounds.r-bounds.l)/10,bounds.b);world.append(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:i===5?'axis':'grid'}));a=pos(bounds.l,bounds.t+i*(bounds.b-bounds.t)/10);b=pos(bounds.r,bounds.t+i*(bounds.b-bounds.t)/10);world.append(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:i===5?'axis':'grid'}));}
for(let score=0;score<=100;score+=25){const p=pos(bounds.l+score/100*(bounds.r-bounds.l),bounds.b),q=pos(bounds.l,bounds.b-score/100*(bounds.b-bounds.t));if(p[0]>=bounds.l&&p[0]<=bounds.r)svg.append(el('text',{x:p[0],y:858,'font-size':10,'text-anchor':'middle'},score));if(q[1]>=bounds.t&&q[1]<=bounds.b)svg.append(el('text',{x:54,y:q[1]+3,'font-size':10,'text-anchor':'end'},score));}
svg.append(el('text',{x:64,y:44,'font-size':14},'对齐依据 ↑（0–100）'),el('text',{x:1536,y:875,'font-size':14,'text-anchor':'end'},'投入 →（0–100）'));
groups.forEach(g=>{const p=pos(g.cx<0?90:834,g.cy>0?108:488);world.append(el('text',{x:p[0],y:p[1],'font-size':15,fill:g.color},g.name));});
const labelBoxes=[];
tasks.forEach(d=>{const p=pos(d.x,d.y);const font=Math.min(17,11*k),width=d.label.length*font;const right=p[0]+9+width<Math.min(bounds.r,pos(d.g.cx<0?800:1536,0)[0])-8;const t=[p[0]+(right?9:-9),p[1]-6];if(p[0]<bounds.l||p[0]>bounds.r||p[1]<bounds.t||p[1]>bounds.b)return;const node=el('g',{class:'request'});node.append(el('title',{},d.label+'\n对齐依据 '+d.alignment+' / 投入 '+d.investment+'\n'+d.reason));node.append(el('circle',{cx:p[0],cy:p[1],r:3,fill:d.g.color}));let placement=null;for(const dy of [-6,14,-20,28]){for(const dir of [right?1:-1,right?-1:1]){const x=p[0]+dir*9,y=p[1]+dy,box={x:dir===1?x:x-width,y:y-font,w:width,h:font+3};if(box.x<bounds.l||box.x+box.w>bounds.r||box.y<bounds.t||box.y+box.h>bounds.b)continue;if(labelBoxes.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y))continue;placement={x,y,dir,box};break;}if(placement)break;}const label=el('text',{x:placement?.x??t[0],y:placement?.y??t[1],'font-size':font,'text-anchor':(placement?.dir??(right?1:-1))===1?'start':'end'},d.label);if(placement)labelBoxes.push(placement.box);else label.style.visibility='hidden';node.append(label);node.addEventListener('pointerenter',()=>{label.style.visibility='visible';world.append(node);});node.addEventListener('pointerleave',()=>{if(!placement)label.style.visibility='hidden';});node.addEventListener('click',()=>{if(drag?.moved)return;document.getElementById('status').textContent='对齐 '+d.alignment+' · 投入 '+d.investment+'｜'+d.label+' '+d.reason;});world.append(node);});
document.getElementById('scale').textContent=Math.round(k*100)+'%';document.getElementById('minus').disabled=k===1;document.getElementById('plus').disabled=k===6;}
function zoom(next){k=Math.max(1,Math.min(6,next));if(k===1){cx=800;cy=459;}draw();}
document.getElementById('plus').onclick=()=>zoom(k*1.4);document.getElementById('minus').onclick=()=>zoom(k/1.4);document.getElementById('home').onclick=()=>zoom(1);
function point(e){const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*1600/r.width,(e.clientY-r.top)*900/r.height];}
svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=point(e),next=Math.max(1,Math.min(6,k*Math.exp(-e.deltaY*.002)));cx+=(x-mid.x)*(1/k-1/next);cy+=(y-mid.y)*(1/k-1/next);zoom(next);},{passive:false});
svg.addEventListener('dblclick',e=>{const [x,y]=point(e);const wx=cx+(x-mid.x)/k,wy=cy+(y-mid.y)/k;cx=wx<800?432:1168;cy=wy<459?268.5:649.5;zoom(1.9);});
svg.addEventListener('pointerdown',e=>{const [x,y]=point(e);drag={x,y,cx,cy,moved:false};svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=point(e);if(Math.abs(x-drag.x)+Math.abs(y-drag.y)>5)drag.moved=true;if(k>1){cx=drag.cx-(x-drag.x)/k;cy=drag.cy-(y-drag.y)/k;draw();}});svg.addEventListener('pointerup',()=>setTimeout(()=>drag=null,0));svg.addEventListener('pointercancel',()=>drag=null);draw();
</script></body></html>
