const ns = 'http://www.w3.org/2000/svg';
const bg = document.getElementById('background');
const layer = document.getElementById('tasks');
const panel = document.getElementById('panel');

let page = 0;

const cats = ['提问与学习', '查资料与找方案', '文字与结构', '图片与动画', '页面与交互', '数据与脚本'];

function el(tag, a = {}, text) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function xy(d) {
  return [80 + d.investment * 9.9, 780 - d.alignment * 5.7];
}

const nodes = content.tasks.map(d => {
  const node = el('g', { class: 'task', tabindex: 0, role: 'button', 'aria-label': d.text });
  const ring = el('circle', { class: 'ring', r: 9.5, fill: 'none', stroke: d.color, 'stroke-width': 2.5, opacity: 0 });
  const dot = el('circle', { class: 'dot', r: 3.5, fill: d.color });
  const text = el('text', { x: 10, y: -5, 'font-size': 11 });
  const title = el('title', {}, d.text + '：对齐依据 ' + d.alignment + '，预期投入 ' + d.investment + '。' + d.reason);
  node.append(ring, dot, text, title);

  function showDetail() {
    const same = content.tasks.filter(t => Math.hypot(t.investment - d.investment, t.alignment - d.alignment) < 0.5);
    if (same.length > 1) {
      document.getElementById('detail').textContent = '同位项（' + same.length + '项）：' + same.map(t => t.text + '（对齐 ' + t.alignment + ' / 投入 ' + t.investment + ' · ' + t.reason + '）').join(' ； ');
    } else {
      document.getElementById('detail').textContent = d.text + '　对齐依据 ' + d.alignment + ' / 预期投入 ' + d.investment + ' · ' + d.reason;
    }
  }

  node.addEventListener('click', showDetail);
  node.addEventListener('focus', showDetail);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showDetail();
    }
  });

  layer.append(node);
  return node;
});

  }

  bg.append(el('text', { x: 80, y: 182, 'font-size': 13.5, 'font-weight': '600', fill: '#475569' }, '对齐依据 ↑'));
  bg.append(el('text', { x: 1070, y: 824, 'font-size': 13.5, 'font-weight': '600', fill: '#475569', 'text-anchor': 'end' }, '下一次反馈前的预期投入 →'));

  [
    ['轻量交付（满足用途即停止）', 96, 235, '#47796e'],
    ['深度建设（证据扎实且确有需求才扩大）', 593, 235, '#9b793b'],
    ['探索（摸索边界与假设）', 96, 520, '#526dad'],
    ['高暴露风险（先收缩为可核验小步）', 593, 520, '#aa645b']
  ].forEach(([t, x, y, col]) => {
    bg.append(el('text', { x, y, 'font-size': 13.5, 'font-weight': '500', fill: col, opacity: 0.72 }, t));
  });
}

function update() {
  const s = content.slides[page];
  const sequence = s.sequence || [];
  const current = sequence.length > 0 ? sequence[Math.min(step, sequence.length - 1)] : null;
  let catCounts = [0, 0, 0, 0, 0, 0];
  let boxes = [];

  // Determine layout priority order for tasks on slides 2..6
  let layoutOrder = [];
  if (page >= 2) {
    if (current !== null && current !== undefined) layoutOrder.push(current);
    sequence.forEach(id => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
    s.active.forEach(id => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
    content.tasks.forEach((_, id) => {
      if (!layoutOrder.includes(id)) layoutOrder.push(id);
    });
  } else {
    layoutOrder = content.tasks.map((_, id) => id);
  }

  // Pre-calculate label placements with smart collision testing (try right, then try left)
  const labelStates = new Map();

  for (const id of layoutOrder) {
    const d = content.tasks[id];
    const p = (page === 0) ? [72 + d.cat * 249, 248 + (catCounts[d.cat]++) * 43] : xy(d);
    const active = s.active.includes(d.id);
    const isCurrent = (page === 6 && d.id === current);
    const isSequence = (page === 6 && sequence.includes(d.id));

    if (page === 0) {
      labelStates.set(id, { visible: true, tx: 10, ty: -3, anchor: 'start', fontSize: 11, fontWeight: '400', fill: '#252b30', isWrapped: true, opacity: 1 });
    } else if (page === 1) {
      const fontSize = 11.5;
      const w = d.text.length * fontSize * 0.95;
      // Try right placement
      let chosen = null;
      if (p[0] + w + 12 <= 1070) {
        const boxRight = { x: p[0] + 10, y: p[1] - 17, w, h: 18 };
        const collideRight = boxes.some(b => boxRight.x < b.x + b.w && boxRight.x + boxRight.w > b.x && boxRight.y < b.y + b.h && boxRight.y + boxRight.h > b.y);
        if (!collideRight) chosen = { box: boxRight, tx: 10, anchor: 'start' };
      }
      if (!chosen && p[0] - w - 10 >= 70) {
        const boxLeft = { x: p[0] - w - 10, y: p[1] - 17, w, h: 18 };
        const collideLeft = boxes.some(b => boxLeft.x < b.x + b.w && boxLeft.x + boxLeft.w > b.x && boxLeft.y < b.y + b.h && boxLeft.y + boxLeft.h > b.y);
        if (!collideLeft) chosen = { box: boxLeft, tx: -10, anchor: 'end' };
      }
      if (chosen) {
        boxes.push(chosen.box);
        labelStates.set(id, { visible: true, tx: chosen.tx, ty: -4, anchor: chosen.anchor, fontSize: 11.5, fontWeight: '400', fill: '#334155', isWrapped: false, opacity: 0.9 });
      } else {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize: 11.5, fontWeight: '400', fill: '#334155', isWrapped: false, opacity: 0 });
      }
    } else {
      // Pages 2..6 (Slides 3..7)
      if (!active) {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize: 12, fontWeight: '400', fill: '#64748b', isWrapped: false, opacity: 0 });
        continue;
      }
      const fontSize = (page === 6 && isCurrent) ? 14 : 12.5;
      const fontWeight = (page === 6 && isCurrent) ? '600' : '500';
      const fill = (page === 6 && isCurrent) ? '#0f172a' : '#1e293b';
      const w = d.text.length * fontSize * 0.95;
      const h = 18;

      let chosen = null;
      if (p[0] + w + 14 <= 1070) {
        const boxRight = { x: p[0] + 12, y: p[1] - 17, w, h };
        const collideRight = boxes.some(b => boxRight.x < b.x + b.w && boxRight.x + boxRight.w > b.x && boxRight.y < b.y + b.h && boxRight.y + boxRight.h > b.y);
        if (!collideRight) chosen = { box: boxRight, tx: 12, anchor: 'start' };
      }
      if (!chosen && p[0] - w - 12 >= 70) {
        const boxLeft = { x: p[0] - w - 12, y: p[1] - 17, w, h };
        const collideLeft = boxes.some(b => boxLeft.x < b.x + b.w && boxLeft.x + boxLeft.w > b.x && boxLeft.y < b.y + b.h && boxLeft.y + boxLeft.h > b.y);
        if (!collideLeft) chosen = { box: boxLeft, tx: -12, anchor: 'end' };
      }
      if (!chosen && (page === 6 && isCurrent)) {
        const isRight = (1070 - p[0]) >= (p[0] - 80);
        chosen = { box: { x: isRight ? p[0] + 14 : p[0] - w - 14, y: p[1] - 17, w, h }, tx: isRight ? 14 : -14, anchor: isRight ? 'start' : 'end' };
      }

      if (chosen) {
        boxes.push(chosen.box);
        labelStates.set(id, { visible: true, tx: chosen.tx, ty: -4, anchor: chosen.anchor, fontSize, fontWeight, fill, isWrapped: false, opacity: 1 });
      } else {
        labelStates.set(id, { visible: false, tx: 10, ty: -4, anchor: 'start', fontSize, fontWeight, fill, isWrapped: false, opacity: 0 });
      }
    }
  }

  // Apply visual updates to nodes
  content.tasks.forEach((d, i) => {
    const node = nodes[i];
    const active = s.active.includes(d.id);
    const isRing = (page >= 2 && page <= 5 && active) || (page === 6 && s.sequence && s.sequence.includes(d.id));

    const ring = node.querySelector('.ring');
    ring.setAttribute('opacity', isRing ? '0.85' : '0');

    node.style.opacity = (page < 2) ? '1' : (active ? '1' : '0.12');

    const text = node.querySelector('text');
    text.replaceChildren();

    const ls = labelStates.get(d.id);
    if (!ls) return;

    text.setAttribute('font-size', ls.fontSize);
    text.setAttribute('fill', ls.fill);
    text.style.fontWeight = ls.fontWeight;
    text.setAttribute('x', ls.tx);
    text.setAttribute('y', ls.ty);
    text.setAttribute('text-anchor', ls.anchor);

    if (ls.isWrapped) {
      const chars = 18;
      for (let j = 0; j < d.text.length; j += chars) {
        text.append(el('tspan', { x: 10, dy: j === 0 ? 0 : 15 }, d.text.slice(j, j + chars)));
      }
      text.style.opacity = '1';
    } else {
      text.textContent = d.text;
      text.style.opacity = ls.visible ? ls.opacity : 0;
    }
  });

  // Position nodes
  let curCatCounts = [0, 0, 0, 0, 0, 0];
  content.tasks.forEach((d, i) => {
    let p = xy(d);
    if (page === 0) {
      p = [72 + d.cat * 249, 248 + (curCatCounts[d.cat]++) * 43];
    }
    nodes[i].style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
  });

  panel.querySelectorAll('.step').forEach((e, i) => {
    e.classList.toggle('on', page === 1 || i <= step);
  });

  updateControls();
}

function updateControls() {
  const s = content.slides[page];
  const maxStep = (s.steps && s.steps.length > 0) ? s.steps.length - 1 : 0;
  const canPlay = (page === 6 && maxStep > 0);
  document.getElementById('prev').disabled = (page === 0);
  document.getElementById('next').disabled = (page === 6);
  document.getElementById('prevStep').disabled = (!canPlay || step === 0);
  document.getElementById('nextStep').disabled = (!canPlay || step >= maxStep);
  document.getElementById('replay').disabled = !canPlay;
  document.querySelectorAll('[data-page]').forEach(b => {
    b.setAttribute('aria-current', Number(b.dataset.page) === page);
  });
  const playBtn = document.getElementById('play');
  if (!canPlay) {
    playBtn.disabled = true;
    playBtn.textContent = '播放';
  } else {
    playBtn.disabled = false;
    if (step >= maxStep && !playing) {
      playBtn.textContent = '重播本页';
    } else {
      playBtn.textContent = playing ? '暂停' : '播放';
    }
  }
}

function schedule() {
  clearTimeout(timer);
  if (!playing || page !== 6) return;
  const maxStep = content.slides[page].steps.length - 1;
  timer = setTimeout(() => {
    if (step < maxStep) {
      step++;
      update();
      if (step < maxStep) {
        schedule();
      } else {
        playing = false;
        updateControls();
      }
    } else {
      playing = false;
      updateControls();
    }
  }, 2400);
}

function show(n, targetStep) {
  page = Math.max(0, Math.min(6, n));
  const s = content.slides[page];
  const maxStep = (s.steps && s.steps.length > 0) ? s.steps.length - 1 : 0;
  const canPlay = (page === 6 && maxStep > 0);
  if (targetStep !== undefined) {
    step = Math.max(0, Math.min(maxStep, targetStep));
    playing = false;
  } else {
    step = (matchMedia('(prefers-reduced-motion: reduce)').matches && s.steps.length > 0) ? maxStep : 0;
    playing = !matchMedia('(prefers-reduced-motion: reduce)').matches && canPlay;
  }
  clearTimeout(timer);
  document.getElementById('heading').textContent = s.name;
  document.getElementById('subtitle').textContent = s.line;
  document.getElementById('detail').textContent = '';
  panel.replaceChildren();
  s.steps.forEach(([title, body]) => {
    const e = document.createElement('section');
    e.className = 'step';
    const h = document.createElement('strong');
    h.textContent = title;
    const p = document.createElement('p');
    p.textContent = body;
    e.append(h, p);
    panel.append(e);
  });
  document.getElementById('hint').textContent = page === 0
    ? '45 项日常请求 · 颜色对应四象限行动状态 · 下一页查看坐标分布'
    : '评分为情境估计 · 点位保持不变 · 点击点查看依据与同位项 · 方向键翻页，上下键单步';
  background();
  update();
  if (playing) schedule();
}

window.show = show;
window.setStep = function(st) {
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  step = Math.max(0, Math.min(maxStep, st));
  playing = false;
  clearTimeout(timer);
  update();
};

for (let i = 0; i < 7; i++) {
  const b = document.createElement('button');
  b.textContent = i + 1;
  b.dataset.page = i;
  b.onclick = () => show(i);
  document.getElementById('pages').append(b);
}

document.getElementById('prev').onclick = () => show(page - 1);
document.getElementById('next').onclick = () => show(page + 1);

document.getElementById('prevStep').onclick = () => {
  if (document.getElementById('prevStep').disabled) return;
  clearTimeout(timer);
  playing = false;
  if (step > 0) {
    step--;
    update();
  }
};

document.getElementById('nextStep').onclick = () => {
  if (document.getElementById('nextStep').disabled) return;
  clearTimeout(timer);
  playing = false;
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  if (step < maxStep) {
    step++;
    update();
  }
};

document.getElementById('replay').onclick = () => {
  if (document.getElementById('replay').disabled) return;
  step = 0;
  playing = true;
  update();
  schedule();
};

document.getElementById('play').onclick = () => {
  if (document.getElementById('play').disabled) return;
  const maxStep = (content.slides[page].steps && content.slides[page].steps.length > 0) ? content.slides[page].steps.length - 1 : 0;
  if (step >= maxStep) {
    step = 0;
    playing = true;
    update();
    schedule();
  } else {
    playing = !playing;
    updateControls();
    if (playing) schedule();
    else clearTimeout(timer);
  }
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(page + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(page - 1); }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault();
    if (!document.getElementById('nextStep').disabled) {
      document.getElementById('nextStep').click();
    }
  }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    if (!document.getElementById('prevStep').disabled) {
      document.getElementById('prevStep').click();
    }
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!document.getElementById('play').disabled) {
      document.getElementById('play').click();
    }
  }
});

if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  playing = false;
}

show(0);
</script>
</body>
</html>
