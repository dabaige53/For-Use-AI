const ns='http://www.w3.org/2000/svg',bg=document.getElementById('background'),layer=document.getElementById('tasks'),panel=document.getElementById('panel');let page=0,step=0,playing=true,timer=null;

function el(tag,a={},text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(a))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}

function update(){const s=content.slides[page],sequence=s.sequence||[],current=sequence[Math.min(step,sequence.length-1)];let catCounts=[0,0,0,0,0,0],boxes=[];

function schedule(){clearTimeout(timer);if(!playing||page<2)return;timer=setTimeout(()=>{step=Math.min(step+1,content.slides[page].steps.length-1);update();if(step<content.slides[page].steps.length-1)schedule();},2400);}
function show(n){page=Math.max(0,Math.min(6,n));step=0;const s=content.slides[page];document.getElementById('heading').textContent=s.name;document.getElementById('subtitle').textContent=s.line;document.getElementById('detail').textContent='';panel.replaceChildren();s.steps.forEach(([title,body])=>{const e=document.createElement('section');e.className='step';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=body;e.append(h,p);panel.append(e);});document.getElementById('hint').textContent=page===0?'45 个请求 · 颜色对应四象限 · 下一页查看评分位置':'评分为情境估计 · 点位保持不变 · 点击点查看依据 · 方向键翻页';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.page)===page));document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===6;background();update();schedule();}
for(let i=0;i<7;i++){const b=document.createElement('button');b.textContent=i+1;b.dataset.page=i;b.onclick=()=>show(i);document.getElementById('pages').append(b);}document.getElementById('prev').onclick=()=>show(page-1);document.getElementById('next').onclick=()=>show(page+1);document.getElementById('replay').onclick=()=>{step=0;update();schedule();};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放';schedule();};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(page+1);if(e.key==='ArrowLeft')show(page-1);if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}});if(matchMedia('(prefers-reduced-motion:reduce)').matches){playing=false;document.getElementById('play').textContent='播放';}show(0);
</script></body></html>
